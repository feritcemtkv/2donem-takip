<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>2. Donem Takip</title>
<style>
  :root{
    --navy:#1F4E78;
    --navy-deep:#123152;
    --navy-soft:#e8eef5;
    --accent:#c96a3c;
    --accent-soft:#f7e6dc;
    --good:#2f8f5b;
    --good-soft:#e3f3ea;
    --paper:#fbfaf7;
    --line:#e2e0d8;
    --ink:#25262b;
    --ink-soft:#6b6f76;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif; margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--navy); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header.top .back{
    font-size:22px; line-height:1; padding:6px 10px; margin:-6px 0 -6px -10px;
    cursor:pointer; opacity:.9; border-radius:8px;
  }
  header.top .back:active{background:rgba(255,255,255,.15);}
  header.top h1{font-size:18px; font-weight:600; flex:1; letter-spacing:.2px;}
  header.top .sub{font-size:12px; opacity:.8; font-family:inherit;}

  .classbar{display:flex; gap:8px; padding:10px 14px; background:var(--navy-deep); overflow-x:auto;}
  .classbar button{border:none; background:rgba(255,255,255,.12); color:#fff; padding:9px 18px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap;}
  .classbar button.active{background:var(--accent); color:#fff;}

  main{padding:14px 14px 60px; max-width:720px; margin:0 auto;}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .studentcard{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .studentcard:active{background:#f5f4f0;}
  .studentcard .no{font-size:11px; color:var(--ink-soft); width:28px; flex-shrink:0; text-align:center;}
  .studentcard .name{flex:1; font-size:15.5px; font-weight:600;}
  .studentcard .pct{font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--navy-soft); color:var(--navy); min-width:44px; text-align:center;}
  .studentcard .pct.low{background:var(--accent-soft); color:var(--accent);}
  .studentcard .chev{color:var(--ink-soft); font-size:18px;}

  .sectiontitle{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); font-weight:700; margin:22px 0 8px; display:flex; align-items:center; gap:8px;}
  .sectiontitle:first-child{margin-top:4px;}
  .sectiontitle .line{flex:1; height:1px; background:var(--line);}

  .fab{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; font-size:28px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:15; display:flex; align-items:center; justify-content:center;}
  .fab:active{transform:scale(.94);}

  .infobar{display:flex; justify-content:space-between; align-items:center; background:var(--navy-soft); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:var(--navy);}
  .infobar b{font-size:16px;}

  .detail-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .field{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .field input{width:100%; border:none; text-align:center; font-size:16px; font-weight:700; color:var(--navy); background:transparent; font-family:inherit;}
  .field input:focus{outline:2px solid var(--navy); border-radius:6px;}

  .hwrow{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .hwrow:last-child{border-bottom:none;}
  .hwrow .topic{flex:1;}
  .hwrow .topic .t{font-size:14.5px; font-weight:600;}
  .hwrow .topic .d{font-size:12px; color:var(--ink-soft);}
  .hwrow.future .topic .t, .hwrow.future .topic .d{color:var(--ink-soft); font-style:italic;}

  .toggle{width:50px; height:30px; border-radius:999px; background:#dcdad2; position:relative; flex-shrink:0; border:none;}
  .toggle.on{background:var(--good);}
  .toggle .knob{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .knob{left:23px;}

  textarea.note{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:inherit; font-size:14px; min-height:70px; resize:vertical; background:#fff;}

  .levelcard{border:2px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .levelcard.sel{border-color:var(--good); background:var(--good-soft);}
  .levelcard .lh{display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-bottom:4px;}
  .levelcard .lh .score{color:var(--navy);}
  .levelcard .desc{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  .critblock{margin-bottom:20px;}
  .critblock h3{font-size:14.5px; margin-bottom:8px; color:var(--ink); font-family:inherit;}
  .critblock .max{font-size:12px; color:var(--ink-soft); font-weight:400;}

  .rubricsummary{display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff; border-radius:var(--radius); padding:14px 16px; margin:16px 0;}
  .rubricsummary .num{font-size:26px; font-weight:700;}
  .rubricsummary .lbl{font-size:11px; opacity:.8; text-transform:uppercase;}

  .levelpicker{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .levelpicker button{border:none; background:var(--navy-soft); color:var(--navy); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;}
  .levelpicker button.active{background:var(--navy); color:#fff;}

  .studentpicker{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .studentpicker button{border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:999px; font-size:13px; white-space:nowrap;}
  .studentpicker button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}

  .rowline{display:flex; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
  .rowline:last-child{border-bottom:none;}
  .rowline .slot{width:26px; font-size:12px; color:var(--ink-soft); font-weight:700;}
  .rowline input[type=text]{flex:2; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; font-family:inherit;}
  .rowline input[type=date]{flex:1; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; font-family:inherit;}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty .big{font-size:38px; margin-bottom:8px;}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;}
  .toast.show{opacity:.95;}

  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .spin{width:28px; height:28px; border:3px solid var(--navy-soft); border-top-color:var(--navy); border-radius:50%; margin:0 auto 12px; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  a.linklike{color:var(--navy); font-weight:600; text-decoration:none;}
  .backlink{display:block; margin-bottom:14px; color:var(--navy); font-weight:600; text-decoration:none; font-size:14.5px;}
</style>
</head>
<body>

<header class="top" id="topbar">
  <div class="back" id="backBtn" style="visibility:hidden">&#8249;</div>
  <div>
    <h1 id="topTitle">2. Donem Takip</h1>
    <div class="sub" id="topSub"></div>
  </div>
</header>
<div class="classbar" id="classbar"></div>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://miekldpkuclbinclnvvu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pZWtsZHBrdWNsYmluY2xudnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDIxNDIsImV4cCI6MjEwMDk3ODE0Mn0.5e6xes30VH-aDrApuCwmFCI7GkteZe-X55sYGU039VQ';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const LEVELS = ['P1','P2','P3'];

let state = {
  classes: [],
  cls: null,
  students: [],
  homeworks: [],
  hwStatus: {},
  rubrics: {},
  rubricScores: {},
  view: 'roster',
  currentStudentId: null,
  rubricLevel: 'P1',
  rubricEdit: false,
  sortBy: 'no',
  loading: true,
};

const $app = document.getElementById('app');
const $classbar = document.getElementById('classbar');
const $topTitle = document.getElementById('topTitle');
const $topSub = document.getElementById('topSub');
const $backBtn = document.getElementById('backBtn');
const $toast = document.getElementById('toast');

function showToast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>$toast.classList.remove('show'), 1600);
}

function fmtDate(d){
  if(!d) return null;
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayStr(){
  const t = new Date();
  return t.toISOString().slice(0,10);
}

async function loadClasses(){
  const { data } = await sb.from('classes').select('*').order('sort_order');
  state.classes = data || [];
  return state.classes;
}
async function addClass(name){
  name = name.trim();
  if(!name) return;
  if(state.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){
    showToast('Bu sinif zaten var'); return;
  }
  const maxOrder = Math.max(-1, ...state.classes.map(c=>c.sort_order||0));
  const { data } = await sb.from('classes').insert({name, sort_order:maxOrder+1}).select();
  if(data && data[0]) state.classes.push(data[0]);
  await loadClass(name);
}
async function renameClass(oldName, newName){
  newName = newName.trim();
  if(!newName || newName===oldName) return;
  const c = state.classes.find(x=>x.name===oldName);
  if(c) c.name = newName;
  await sb.from('classes').update({name:newName}).eq('name', oldName);
  await sb.from('students').update({class_name:newName}).eq('class_name', oldName);
  await sb.from('homeworks').update({class_name:newName}).eq('class_name', oldName);
  await sb.from('rubrics').update({class_name:newName}).eq('class_name', oldName);
  await loadClass(newName);
  showToast('Sinif adi guncellendi');
}
async function deleteClass(name){
  state.classes = state.classes.filter(c=>c.name!==name);
  const { data: students } = await sb.from('students').select('id').eq('class_name', name);
  const ids = (students||[]).map(s=>s.id);
  if(ids.length){
    await sb.from('homework_status').delete().in('student_id', ids);
    await sb.from('rubric_scores').delete().in('student_id', ids);
    await sb.from('students').delete().eq('class_name', name);
  }
  await sb.from('homeworks').delete().eq('class_name', name);
  await sb.from('rubrics').delete().eq('class_name', name);
  await sb.from('classes').delete().eq('name', name);
  showToast('Sinif silindi');
  const next = state.classes[0];
  if(next) await loadClass(next.name);
  else { state.cls=null; state.students=[]; state.homeworks=[]; state.loading=false; render(); }
}

async function loadClass(cls){
  state.loading = true; render();
  const { data: students } = await sb.from('students').select('*').eq('class_name',cls).order('sort_order');
  const { data: homeworks } = await sb.from('homeworks').select('*').eq('class_name',cls).order('slot_no');
  const ids = (students||[]).map(s=>s.id);
  let hwStatusRows = [];
  let rubricScoreRows = [];
  if(ids.length){
    const r1 = await sb.from('homework_status').select('*').in('student_id', ids);
    hwStatusRows = r1.data || [];
    const r2 = await sb.from('rubric_scores').select('*').in('student_id', ids);
    rubricScoreRows = r2.data || [];
  }
  const { data: rubricRows } = await sb.from('rubrics').select('*').eq('class_name', cls);

  const hwStatus = {};
  for(const row of hwStatusRows){
    hwStatus[row.student_id] = hwStatus[row.student_id] || {};
    hwStatus[row.student_id][row.slot_no] = row.done;
  }
  const rubricScores = {};
  for(const row of rubricScoreRows){
    rubricScores[row.student_id] = rubricScores[row.student_id] || {};
    rubricScores[row.student_id][row.level] = rubricScores[row.student_id][row.level] || {};
    rubricScores[row.student_id][row.level][row.criteria_index] = row.score;
  }
  const rubrics = {};
  for(const row of (rubricRows||[])){
    rubrics[row.level] = row.criteria;
  }

  state.cls = cls;
  state.students = students || [];
  state.homeworks = homeworks || [];
  state.hwStatus = hwStatus;
  state.rubricScores = rubricScores;
  state.rubrics = rubrics;
  state.loading = false;
  render();
}

function assignedCount(){
  const today = todayStr();
  return state.homeworks.filter(h => h.hw_date && h.hw_date <= today).length;
}
function completedCount(studentId){
  const today = todayStr();
  const st = state.hwStatus[studentId] || {};
  let n = 0;
  for(const h of state.homeworks){
    if(h.hw_date && h.hw_date <= today && st[h.slot_no]) n++;
  }
  return n;
}
function pct(studentId){
  const a = assignedCount();
  if(a===0) return 0;
  return Math.round((completedCount(studentId)/a)*100);
}
function rubricTotal(studentId, level){
  const crit = state.rubrics[level] || [];
  const scores = (state.rubricScores[studentId]||{})[level] || {};
  let sum = 0, max = 0, any=false;
  crit.forEach((c,i)=>{
    max += c.max;
    if(scores[i]!=null){ sum += scores[i]; any=true; }
  });
  return { sum, max, grade: any? Math.round(sum/max*100) : null };
}
function studentById(id){ return state.students.find(s=>s.id===id); }

async function toggleHw(studentId, slotNo){
  const cur = !!(state.hwStatus[studentId]||{})[slotNo];
  const next = !cur;
  state.hwStatus[studentId] = state.hwStatus[studentId] || {};
  state.hwStatus[studentId][slotNo] = next;
  render();
  await sb.from('homework_status').upsert({student_id:studentId, slot_no:slotNo, done: next});
}
async function updateStudentField(studentId, field, value){
  const s = studentById(studentId);
  if(s) s[field] = value;
  await sb.from('students').update({[field]: value}).eq('id', studentId);
  showToast('Kaydedildi');
}
async function saveRubric(level){
  const criteria = state.rubrics[level] || [];
  await sb.from('rubrics').upsert({class_name: state.cls, level, criteria}, {onConflict:'class_name,level'});
}
function addCriterion(level){
  state.rubrics[level] = state.rubrics[level] || [];
  state.rubrics[level].push({name:'Yeni Olcut', max:4, levels:[
    {score:4, label:'Mukemmel', desc:''},
    {score:3, label:'Iyi', desc:''},
    {score:2, label:'Orta', desc:''},
    {score:1, label:'Gelistirilmesi Gerekir', desc:''},
  ]});
  saveRubric(level);
  render();
}
function deleteCriterion(level, ci){
  if(!confirm('Bu olcut silinsin mi?')) return;
  state.rubrics[level].splice(ci,1);
  saveRubric(level);
  render();
}
function updateCriterion(level, ci, field, value){
  state.rubrics[level][ci][field] = field==='max' ? (parseInt(value)||1) : value;
  saveRubric(level);
}
function addLevel(level, ci){
  const c = state.rubrics[level][ci];
  c.levels = c.levels || [];
  c.levels.push({score:1, label:'Yeni Seviye', desc:''});
  saveRubric(level);
  render();
}
function deleteLevel(level, ci, li){
  state.rubrics[level][ci].levels.splice(li,1);
  saveRubric(level);
  render();
}
function updateLevel(level, ci, li, field, value){
  const lv = state.rubrics[level][ci].levels[li];
  lv[field] = field==='score' ? (parseInt(value)||0) : value;
  saveRubric(level);
}

async function setRubricScore(studentId, level, critIndex, score){
  state.rubricScores[studentId] = state.rubricScores[studentId] || {};
  state.rubricScores[studentId][level] = state.rubricScores[studentId][level] || {};
  state.rubricScores[studentId][level][critIndex] = score;
  render();
  await sb.from('rubric_scores').upsert({student_id:studentId, level, criteria_index:critIndex, score});
  showToast('Puan kaydedildi');
}
async function updateHomework(slotNo, field, value){
  const hw = state.homeworks.find(h=>h.slot_no===slotNo);
  if(hw) hw[field] = value;
  await sb.from('homeworks').update({[field]: value}).eq('class_name', state.cls).eq('slot_no', slotNo);
}
async function addHomework(){
  const maxSlot = Math.max(0, ...state.homeworks.map(h=>h.slot_no||0));
  const nextSlot = maxSlot+1;
  const { data } = await sb.from('homeworks').insert({class_name:state.cls, slot_no:nextSlot, topic:'', hw_date:null}).select();
  if(data && data[0]) state.homeworks.push(data[0]);
  render();
  showToast('Odev eklendi');
}
async function deleteHomework(slotNo){
  state.homeworks = state.homeworks.filter(h=>h.slot_no!==slotNo);
  render();
  const { data: students } = await sb.from('students').select('id').eq('class_name', state.cls);
  const ids = (students||[]).map(s=>s.id);
  if(ids.length){
    await sb.from('homework_status').delete().eq('slot_no', slotNo).in('student_id', ids);
  }
  await sb.from('homeworks').delete().eq('class_name', state.cls).eq('slot_no', slotNo);
  showToast('Odev silindi');
}
async function addStudent(name){
  const maxOrder = Math.max(0, ...state.students.map(s=>s.sort_order||0));
  const { data } = await sb.from('students').insert({class_name:state.cls, name, sort_order:maxOrder+1}).select();
  if(data && data[0]) state.students.push(data[0]);
  render();
  showToast('Ogrenci eklendi');
}
async function renameStudent(studentId, newName){
  const s = studentById(studentId);
  if(s) s.name = newName;
  render();
  await sb.from('students').update({name:newName}).eq('id', studentId);
  showToast('Isim guncellendi');
}
async function deleteStudent(studentId){
  state.students = state.students.filter(s=>s.id!==studentId);
  delete state.hwStatus[studentId];
  delete state.rubricScores[studentId];
  state.view = 'roster';
  render();
  await sb.from('students').delete().eq('id', studentId);
  showToast('Ogrenci silindi');
}

async function exportBackup(){
  showToast('Yedek hazirlaniyor...');
  const [c,s,h,hs,r,rs] = await Promise.all([
    sb.from('classes').select('*'),
    sb.from('students').select('*'),
    sb.from('homeworks').select('*'),
    sb.from('homework_status').select('*'),
    sb.from('rubrics').select('*'),
    sb.from('rubric_scores').select('*'),
  ]);
  const backup = {
    exported_at: new Date().toISOString(),
    classes: c.data||[], students: s.data||[], homeworks: h.data||[],
    homework_status: hs.data||[], rubrics: r.data||[], rubric_scores: rs.data||[],
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'takip-yedek-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Yedek indirildi');
}

function render(){
  renderClassbar();
  renderTopbar();
  if(state.loading){
    $app.innerHTML = '<div class="loading"><div class="spin"></div>Yukleniyor...</div>';
    return;
  }
  if(!state.cls){
    $app.innerHTML = '<div class="empty"><div class="big">&#127891;</div>Henuz sinif yok.<br>Ustteki "+ Sinif" ile ilk sinifini ekle.</div>';
    return;
  }
  if(state.view==='roster') renderRoster();
  else if(state.view==='student') renderStudent();
  else if(state.view==='homeworks') renderHomeworks();
  else if(state.view==='rubric') renderRubric();
}

function renderClassbar(){
  $classbar.innerHTML = state.classes.map(c=>
    '<button class="'+(c.name===state.cls&&state.view==='roster'?'active':'')+'" data-cls="'+c.name+'">'+c.name+'</button>'
  ).join('') + '<button data-add="1" style="background:rgba(255,255,255,.3)">+ Sinif</button>';
  $classbar.querySelectorAll('button[data-cls]').forEach(b=>{
    b.onclick = ()=>{ state.view='roster'; loadClass(b.dataset.cls); };
  });
  const addBtn = $classbar.querySelector('button[data-add]');
  if(addBtn) addBtn.onclick = ()=>{
    const name = prompt('Yeni sinif adi (orn. 11A):');
    if(name && name.trim()) addClass(name.trim());
  };
}

function renderTopbar(){
  if(!state.cls){
    $backBtn.style.visibility='hidden';
    $topTitle.textContent = '2. Donem Takip';
    $topSub.textContent = '';
    return;
  }
  if(state.view==='roster'){
    $backBtn.style.visibility='hidden';
    $topTitle.textContent = state.cls + ' Subesi';
    $topSub.textContent = state.students.length + ' ogrenci';
  } else if(state.view==='student'){
    $backBtn.style.visibility='visible';
    const s = studentById(state.currentStudentId);
    $topTitle.textContent = s ? s.name : '';
    $topSub.textContent = state.cls;
  } else if(state.view==='homeworks'){
    $backBtn.style.visibility='visible';
    $topTitle.textContent = 'Odev Tanimlama';
    $topSub.textContent = state.cls;
  } else if(state.view==='rubric'){
    $backBtn.style.visibility='visible';
    $topTitle.textContent = 'Performans Rubrigi';
    $topSub.textContent = state.cls + ' - ' + state.rubricLevel;
  }
}
$backBtn.onclick = ()=>{ state.view='roster'; render(); };

function renderRoster(){
  const a = assignedCount();
  $app.innerHTML =
    '<div class="infobar">' +
      '<div>Bugune kadar verilen odev: <b class="num">'+a+'</b> / '+state.homeworks.length+'</div>' +
      '<div><a class="linklike" id="hwLink">Odevleri duzenle &rsaquo;</a></div>' +
    '</div>' +
    '<div style="text-align:right; margin:-6px 0 14px;"><a class="linklike" id="backupLink" style="font-size:12.5px;">&#128190; Tum verileri yedekle (JSON indir)</a></div>' +
    '<div class="sectiontitle"><span>Ogrenciler</span><span class="line"></span></div>' +
    '<div style="display:flex; gap:8px; margin-bottom:10px;">' +
      '<button id="sortNo" style="flex:1; border:none; padding:9px; border-radius:999px; font-size:12.5px; font-weight:700; background:'+(state.sortBy==='no'?'var(--navy)':'var(--navy-soft)')+'; color:'+(state.sortBy==='no'?'#fff':'var(--navy)')+';">Numaraya gore</button>' +
      '<button id="sortName" style="flex:1; border:none; padding:9px; border-radius:999px; font-size:12.5px; font-weight:700; background:'+(state.sortBy==='name'?'var(--navy)':'var(--navy-soft)')+'; color:'+(state.sortBy==='name'?'#fff':'var(--navy)')+';">Isme gore</button>' +
    '</div>' +
    '<div id="rosterList"></div>' +
    '<div class="sectiontitle" style="margin-top:26px;"><span>Rubrikler</span><span class="line"></span></div>' +
    '<div class="card" style="display:flex; gap:8px; flex-wrap:wrap;">' +
      LEVELS.map(l=>'<button class="levelpicker-btn" data-lvl="'+l+'" style="flex:1; min-width:80px; border:none; background:var(--navy-soft); color:var(--navy); padding:12px; border-radius:10px; font-weight:700;">'+l+'</button>').join('') +
    '</div>' +
    '<div class="sectiontitle" style="margin-top:26px;"><span>Sinif Islemleri</span><span class="line"></span></div>' +
    '<div class="card" style="display:flex; gap:10px;">' +
      '<button id="renameClsBtn" style="flex:1; border:1px solid var(--line); background:#fff; color:var(--navy); padding:12px; border-radius:10px; font-weight:700; font-size:14px;">Sinif Adini Duzenle</button>' +
      '<button id="deleteClsBtn" style="flex:1; border:none; background:#fdecea; color:#b3432f; padding:12px; border-radius:10px; font-weight:700; font-size:14px;">Sinifi Sil</button>' +
    '</div>';
  document.getElementById('hwLink').onclick = ()=>{ state.view='homeworks'; render(); };
  document.getElementById('backupLink').onclick = exportBackup;
  document.getElementById('renameClsBtn').onclick = ()=>{
    const nn = prompt('Yeni sinif adi:', state.cls);
    if(nn && nn.trim() && nn.trim()!==state.cls) renameClass(state.cls, nn.trim());
  };
  document.getElementById('deleteClsBtn').onclick = ()=>{
    if(confirm(state.cls+' sinifi ve tum ogrenci/odev/rubrik verileri kalici olarak silinsin mi?')){
      deleteClass(state.cls);
    }
  };
  $app.querySelectorAll('.levelpicker-btn').forEach(b=>{
    b.onclick = ()=>{ state.rubricLevel = b.dataset.lvl; state.view='rubric'; state.currentStudentId = state.students[0] ? state.students[0].id : null; render(); };
  });

  document.getElementById('sortNo').onclick = ()=>{ state.sortBy='no'; render(); };
  document.getElementById('sortName').onclick = ()=>{ state.sortBy='name'; render(); };

  const list = document.getElementById('rosterList');
  if(!state.students.length){
    list.innerHTML = '<div class="empty"><div class="big">&#128118;</div>Henuz ogrenci yok.<br>Sag alttaki + ile ekleyebilirsin.</div>';
  } else {
    const sorted = [...state.students].sort((a,b)=>{
      if(state.sortBy==='name'){
        return a.name.localeCompare(b.name,'tr');
      }
      const na = parseInt(a.no), nb = parseInt(b.no);
      const va = isNaN(na) ? Infinity : na;
      const vb = isNaN(nb) ? Infinity : nb;
      if(va!==vb) return va-vb;
      return a.name.localeCompare(b.name,'tr');
    });
    list.innerHTML = sorted.map(s=>{
      const p = pct(s.id);
      return '<div class="card studentcard" data-id="'+s.id+'">' +
        '<div class="no">'+(s.no||'')+'</div>' +
        '<div class="name">'+escapeHtml(s.name)+'</div>' +
        '<div class="pct '+(p<60?'low':'')+' num">'+p+'%</div>' +
        '<div class="chev">&rsaquo;</div>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.studentcard').forEach(el=>{
      el.onclick = ()=>{ state.currentStudentId = el.dataset.id; state.view='student'; render(); };
    });
  }
  ensureFab('+', ()=>{
    const name = prompt('Yeni ogrencinin adi soyadi:');
    if(name && name.trim()) addStudent(name.trim());
  });
}

function renderStudent(){
  removeFab();
  const s = studentById(state.currentStudentId);
  if(!s){ state.view='roster'; return render(); }
  const today = todayStr();
  const hwRows = state.homeworks.map(h=>{
    const future = !h.hw_date || h.hw_date > today;
    const done = !!(state.hwStatus[s.id]||{})[h.slot_no];
    const topic = h.topic || ('(Odev '+h.slot_no+' tanimlanmadi)');
    return '<div class="hwrow '+(future?'future':'')+'">' +
      '<div class="topic">' +
        '<div class="t">'+escapeHtml(topic)+'</div>' +
        '<div class="d">'+(h.hw_date ? fmtDate(h.hw_date) : 'Tarih girilmedi')+'</div>' +
      '</div>' +
      '<button class="toggle '+(done?'on':'')+'" data-slot="'+h.slot_no+'" '+(future?'disabled style="opacity:.4"':'')+'><span class="knob"></span></button>' +
    '</div>';
  }).join('');

  const p1 = rubricTotal(s.id,'P1'), p2 = rubricTotal(s.id,'P2'), p3 = rubricTotal(s.id,'P3');

  $app.innerHTML =
    '<a class="backlink" id="toRoster">&lsaquo; '+state.cls+' listesine don</a>' +
    '<div class="sectiontitle"><span>Ogrenci Bilgisi</span><span class="line"></span></div>' +
    '<div class="detail-grid">' +
      '<div class="field"><label>No</label><input type="text" data-f="no" value="'+(s.no||'')+'"></div>' +
    '</div>' +
    '<div class="sectiontitle"><span>Sinav Notlari</span><span class="line"></span></div>' +
    '<div class="detail-grid">' +
      '<div class="field"><label>Q1</label><input type="text" data-f="q1" value="'+(s.q1||'')+'"></div>' +
      '<div class="field"><label>Q2</label><input type="text" data-f="q2" value="'+(s.q2||'')+'"></div>' +
      '<div class="field"><label>Somestr</label><input type="text" data-f="somestr" value="'+(s.somestr||'')+'"></div>' +
    '</div>' +
    '<div class="sectiontitle"><span>Performans</span><span class="line"></span></div>' +
    '<div class="detail-grid">' +
      '<div class="field"><label>P1</label><div class="num" style="font-size:16px;font-weight:700;color:var(--navy)">'+(p1.grade??'-')+'</div></div>' +
      '<div class="field"><label>P2</label><div class="num" style="font-size:16px;font-weight:700;color:var(--navy)">'+(p2.grade??'-')+'</div></div>' +
      '<div class="field"><label>P3</label><div class="num" style="font-size:16px;font-weight:700;color:var(--navy)">'+(p3.grade??'-')+'</div></div>' +
    '</div>' +
    '<div class="sectiontitle"><span>Odev Gecmisi</span><span class="line"></span></div>' +
    '<div class="card">'+hwRows+'</div>' +
    '<div class="sectiontitle"><span>Ogretmen Notu</span><span class="line"></span></div>' +
    '<textarea class="note" id="noteBox" placeholder="Gozlem, veli gorusmesi notu...">'+(s.teacher_note||'')+'</textarea>' +
    '<div class="sectiontitle" style="margin-top:26px;"><span>Ogrenci Islemleri</span><span class="line"></span></div>' +
    '<div class="card" style="display:flex; gap:10px;">' +
      '<button id="renameBtn" style="flex:1; border:1px solid var(--line); background:#fff; color:var(--navy); padding:12px; border-radius:10px; font-weight:700; font-size:14px;">Ismi Duzenle</button>' +
      '<button id="deleteBtn" style="flex:1; border:none; background:#fdecea; color:#b3432f; padding:12px; border-radius:10px; font-weight:700; font-size:14px;">Ogrenciyi Sil</button>' +
    '</div>';

  document.getElementById('renameBtn').onclick = ()=>{
    const newName = prompt('Yeni ad soyad:', s.name);
    if(newName && newName.trim() && newName.trim()!==s.name) renameStudent(s.id, newName.trim());
  };
  document.getElementById('deleteBtn').onclick = ()=>{
    if(confirm(s.name+' silinsin mi? Bu islem geri alinamaz, tum odev ve rubrik verileri de silinir.')){
      deleteStudent(s.id);
    }
  };
  document.getElementById('toRoster').onclick = ()=>{ state.view='roster'; render(); };
  $app.querySelectorAll('.field input').forEach(inp=>{
    inp.onblur = ()=> updateStudentField(s.id, inp.dataset.f, inp.value);
  });
  $app.querySelectorAll('.toggle').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=> toggleHw(s.id, parseInt(btn.dataset.slot));
  });
  const noteBox = document.getElementById('noteBox');
  noteBox.onblur = ()=> updateStudentField(s.id,'teacher_note', noteBox.value);
}

function renderHomeworks(){
  removeFab();
  const rows = state.homeworks.map(h=>
    '<div class="rowline">' +
      '<div class="slot">#'+h.slot_no+'</div>' +
      '<input type="text" placeholder="Konu" value="'+(h.topic||'')+'" data-slot="'+h.slot_no+'" data-f="topic">' +
      '<input type="date" value="'+(h.hw_date||'')+'" data-slot="'+h.slot_no+'" data-f="hw_date">' +
      '<button data-del="'+h.slot_no+'" style="border:none;background:none;color:#b3432f;font-size:20px;padding:4px 6px;">&times;</button>' +
    '</div>'
  ).join('');
  $app.innerHTML =
    '<a class="backlink" id="toRoster2">&lsaquo; '+state.cls+' listesine don</a>' +
    '<div class="card">'+(rows||'<div class="empty">Henuz odev yok.</div>')+'</div>' +
    '<button id="addHwBtn" style="width:100%; border:1px dashed var(--navy); background:var(--navy-soft); color:var(--navy); padding:13px; border-radius:12px; font-weight:700; font-size:14px; margin-bottom:14px;">+ Odev Ekle</button>' +
    '<p style="font-size:12.5px;color:var(--ink-soft);padding:0 4px;">Tarihi bugunden ileri olan odevler, tamamlanma yuzdesine henuz dahil edilmez.</p>';
  document.getElementById('toRoster2').onclick = ()=>{ state.view='roster'; render(); };
  document.getElementById('addHwBtn').onclick = addHomework;
  $app.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.onblur = ()=> updateHomework(parseInt(inp.dataset.slot), inp.dataset.f, inp.value || null);
  });
  $app.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.onclick = ()=>{
      if(confirm('Bu odev silinsin mi? Ogrencilerin bu odeve ait isaretleri de silinir.')){
        deleteHomework(parseInt(btn.dataset.del));
      }
    };
  });
}

function renderRubric(){
  removeFab();
  const level = state.rubricLevel;
  const crit = state.rubrics[level] || [];
  const sid = state.currentStudentId;
  const totals = sid ? rubricTotal(sid, level) : {sum:0,max:0,grade:null};

  const topControls =
    '<a class="backlink" id="toRoster3">&lsaquo; '+state.cls+' listesine don</a>' +
    '<div class="levelpicker">' +
      LEVELS.map(l=>'<button class="'+(l===level?'active':'')+'" data-lvl="'+l+'">'+l+'</button>').join('') +
      '<button id="editToggle" style="background:'+(state.rubricEdit?'var(--accent)':'var(--navy-soft)')+'; color:'+(state.rubricEdit?'#fff':'var(--navy)')+';">'+(state.rubricEdit?'Bitti':'Olcutleri Duzenle')+'</button>' +
    '</div>';

  if(state.rubricEdit){
    const critEdit = crit.map((c,ci)=>{
      const levels = (c.levels||[]).map((lv,li)=>
        '<div class="levelcard" style="cursor:default;">' +
          '<div style="display:flex; gap:8px; margin-bottom:6px;">' +
            '<input type="number" value="'+lv.score+'" data-ci="'+ci+'" data-li="'+li+'" data-f="score" style="width:56px; border:1px solid var(--line); border-radius:6px; padding:6px; font-weight:700;">' +
            '<input type="text" value="'+escapeHtml(lv.label)+'" data-ci="'+ci+'" data-li="'+li+'" data-f="label" placeholder="Seviye adi" style="flex:1; border:1px solid var(--line); border-radius:6px; padding:6px;">' +
            '<button data-dellvl="'+ci+':'+li+'" style="border:none;background:none;color:#b3432f;font-size:18px;">&times;</button>' +
          '</div>' +
          '<textarea data-ci="'+ci+'" data-li="'+li+'" data-f="desc" placeholder="Aciklama" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;font-size:12.5px;min-height:40px;">'+escapeHtml(lv.desc||'')+'</textarea>' +
        '</div>'
      ).join('');
      return '<div class="critblock">' +
        '<div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">' +
          '<input type="text" value="'+escapeHtml(c.name)+'" data-crit="'+ci+'" data-f="name" style="flex:1; border:1px solid var(--line); border-radius:6px; padding:8px; font-weight:700;">' +
          'Tam puan: <input type="number" value="'+c.max+'" data-crit="'+ci+'" data-f="max" style="width:50px; border:1px solid var(--line); border-radius:6px; padding:8px;">' +
          '<button data-delcrit="'+ci+'" style="border:none;background:#fdecea;color:#b3432f;border-radius:6px;padding:6px 10px;font-weight:700;">Sil</button>' +
        '</div>' +
        levels +
        '<button data-addlvl="'+ci+'" style="width:100%; border:1px dashed var(--line); background:#fff; color:var(--ink-soft); padding:8px; border-radius:8px; font-size:12.5px; margin-top:4px;">+ Seviye Ekle</button>' +
      '</div>';
    }).join('');

    $app.innerHTML = topControls + critEdit +
      '<button id="addCritBtn" style="width:100%; border:1px dashed var(--navy); background:var(--navy-soft); color:var(--navy); padding:13px; border-radius:12px; font-weight:700; font-size:14px; margin:10px 0 20px;">+ Yeni Olcut Ekle</button>';

    document.getElementById('addCritBtn').onclick = ()=> addCriterion(level);
    $app.querySelectorAll('[data-delcrit]').forEach(b=> b.onclick = ()=> deleteCriterion(level, parseInt(b.dataset.delcrit)));
    $app.querySelectorAll('[data-addlvl]').forEach(b=> b.onclick = ()=> addLevel(level, parseInt(b.dataset.addlvl)));
    $app.querySelectorAll('[data-dellvl]').forEach(b=>{
      b.onclick = ()=>{ const [ci,li]=b.dataset.dellvl.split(':').map(Number); deleteLevel(level,ci,li); };
    });
    $app.querySelectorAll('input[data-crit]').forEach(inp=>{
      inp.onblur = ()=> updateCriterion(level, parseInt(inp.dataset.crit), inp.dataset.f, inp.value);
    });
    $app.querySelectorAll('[data-ci][data-li]').forEach(inp=>{
      inp.onblur = ()=> updateLevel(level, parseInt(inp.dataset.ci), parseInt(inp.dataset.li), inp.dataset.f, inp.value);
    });
  } else {
    const studentButtons = state.students.map(s=>
      '<button class="'+(s.id===sid?'active':'')+'" data-id="'+s.id+'">'+escapeHtml(s.name)+'</button>'
    ).join('');
    const critHtml = crit.map((c,ci)=>{
      const curScore = sid ? ((state.rubricScores[sid]||{})[level]||{})[ci] : null;
      const levels = (c.levels||[]).map(lv=>
        '<div class="levelcard '+(curScore===lv.score?'sel':'')+'" data-ci="'+ci+'" data-score="'+lv.score+'">' +
          '<div class="lh"><span>'+escapeHtml(lv.label)+'</span><span class="score">'+lv.score+' puan</span></div>' +
          '<div class="desc">'+escapeHtml(lv.desc)+'</div>' +
        '</div>'
      ).join('');
      return '<div class="critblock"><h3>'+escapeHtml(c.name)+' <span class="max">(tam puan: '+c.max+')</span></h3>'+levels+'</div>';
    }).join('');

    $app.innerHTML = topControls +
      '<div class="studentpicker">'+studentButtons+'</div>' +
      (crit.length===0 ? '<div class="empty">Bu performans icin henuz olcut tanimlanmadi.<br>Yukaridaki "Olcutleri Duzenle" ile ekleyebilirsin.</div>' :
      sid ?
        '<div class="rubricsummary">' +
          '<div><div class="lbl">Toplam</div><div class="num">'+totals.sum+' / '+totals.max+'</div></div>' +
          '<div><div class="lbl">Not</div><div class="num">'+(totals.grade!=null?totals.grade:'-')+'</div></div>' +
        '</div>' + critHtml
        : '<div class="empty">Once bir ogrenci secin.</div>');

    $app.querySelectorAll('.studentpicker button').forEach(b=>{
      b.onclick = ()=>{ state.currentStudentId = b.dataset.id; render(); };
    });
    $app.querySelectorAll('.levelcard').forEach(el=>{
      el.onclick = ()=>{
        const ci = parseInt(el.dataset.ci), score = parseInt(el.dataset.score);
        const cur = ((state.rubricScores[sid]||{})[level]||{})[ci];
        setRubricScore(sid, level, ci, cur===score ? null : score);
      };
    });
  }

  document.getElementById('toRoster3').onclick = ()=>{ state.view='roster'; render(); };
  $app.querySelectorAll('.levelpicker button[data-lvl]').forEach(b=>{
    b.onclick = ()=>{ state.rubricLevel = b.dataset.lvl; render(); };
  });
  document.getElementById('editToggle').onclick = ()=>{ state.rubricEdit = !state.rubricEdit; render(); };
}

let fabEl = null;
function ensureFab(label, onClick){
  removeFab();
  fabEl = document.createElement('button');
  fabEl.className = 'fab';
  fabEl.textContent = label;
  fabEl.onclick = onClick;
  document.body.appendChild(fabEl);
}
function removeFab(){
  if(fabEl){ fabEl.remove(); fabEl=null; }
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

(async function init(){
  await loadClasses();
  if(state.classes.length){
    await loadClass(state.classes[0].name);
  } else {
    state.loading = false;
    render();
  }
})();
</script>
</body>
</html>
