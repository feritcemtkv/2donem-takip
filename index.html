<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sınıf Yönetim Panelim</title>
<style>
  :root{
    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface-2:#eef1f8;
    --ink:#1b2436;
    --ink-soft:#6b7280;
    --ink-faint:#9aa1b2;
    --line:#e3e7f0;
    --primary:#3457d5;
    --primary-deep:#233c9e;
    --primary-soft:#e8edfc;
    --amber:#c97a1f;
    --amber-soft:#faf0dd;
    --teal:#0f9d8c;
    --teal-soft:#e1f5f2;
    --red:#d24b4b;
    --red-soft:#fbe8e8;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px -14px rgba(20,25,40,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  h1,h2,h3,h4{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:#fff;}
  .brand .logo .ic{width:22px;height:22px;stroke:#fff;}
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:.1px;}
  .brand .ver{font-size:10.5px;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:700;vertical-align:2px;}
  header.top .spacer{flex:1;}
  .teacherbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);padding:6px 8px 6px 14px;border-radius:999px;cursor:pointer;border:none;}
  .teacherbox .who{text-align:right;line-height:1.25;}
  .teacherbox .name{font-size:13px;font-weight:700;color:var(--ink);}
  .teacherbox .branch{font-size:11px;color:var(--ink-soft);}
  .teacherbox .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

  main#app{padding:26px 30px 70px;max-width:1180px;margin:0 auto;}

  .crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .pagehead h2{font-size:22px;font-weight:800;}
  .pagehead .sub{color:var(--ink-soft);font-size:13px;}
  .pagehead .spacer{flex:1;}
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary-deep);font-weight:700;text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:12px;border:none;background:none;padding:0;}

  .btn{border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-soft{background:var(--primary-soft);color:var(--primary-deep);}
  .btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:default;}

  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:26px;}
  .statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);}
  .statcard .icowrap{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .statcard .icowrap .ic{width:24px;height:24px;stroke:#fff;}
  .statcard .num{font-size:25px;font-weight:800;color:var(--ink);}
  .statcard .lbl{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:1px;}

  .section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-title .line{flex:1;height:1px;background:var(--line);}
  .section-title:first-child{margin-top:0;}

  .classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .classcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;box-shadow:var(--shadow);border-top:4px solid var(--tag,var(--primary));}
  .classcard h3{font-size:19px;margin-bottom:4px;}
  .classcard .meta{font-size:12px;color:var(--ink-soft);margin-bottom:14px;font-weight:600;}
  .classcard .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.blue{background:var(--primary-soft);color:var(--primary-deep);}
  .tag.amber{background:var(--amber-soft);color:var(--amber);}
  .tag.teal{background:var(--teal-soft);color:var(--teal);}
  .addcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;color:var(--ink-soft);font-weight:700;font-size:13.5px;min-height:118px;background:transparent;}
  .addcard:hover{border-color:var(--primary);color:var(--primary-deep);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .infobar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--primary-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;}
  .infobar .item .v{font-size:19px;font-weight:800;color:var(--primary-deep);}
  .infobar .item .k{font-size:11.5px;color:var(--primary-deep);opacity:.75;font-weight:700;}

  .actionrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .actionrow .btn{flex:1;min-width:170px;justify-content:center;}

  .rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .rowcard .no{font-size:11.5px;color:var(--ink-faint);width:24px;flex-shrink:0;text-align:center;font-weight:700;}
  .rowcard .name{flex:1;font-size:14.5px;font-weight:700;}
  .rowcard .pct{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);min-width:46px;text-align:center;}
  .rowcard .pct.low{background:var(--red-soft);color:var(--red);}
  .rowcard .pct.mid{background:var(--amber-soft);color:var(--amber);}
  .rowcard .chev{color:var(--ink-faint);}
  .rowcard .chev .ic{width:16px;height:16px;}

  .field{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center;}
  .field label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .field input{width:100%;border:none;background:transparent;text-align:center;font-size:15px;font-weight:800;color:var(--primary-deep);}
  .field input:focus{outline:2px solid var(--primary);border-radius:6px;}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}

  .hwrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .hwrow:last-child{border-bottom:none;}
  .hwrow .topic{flex:1;}
  .hwrow .topic .t{font-size:14px;font-weight:700;}
  .hwrow .topic .d{font-size:11.5px;color:var(--ink-soft);}
  .hwrow.future .topic .t,.hwrow.future .topic .d{color:var(--ink-faint);font-style:italic;}

  .toggle{width:48px;height:28px;border-radius:999px;background:#dfe3ee;position:relative;flex-shrink:0;border:none;}
  .toggle.on{background:var(--teal);}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.28);}
  .toggle.on .knob{left:23px;}
  .toggle:disabled{opacity:.4;}

  textarea.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;min-height:70px;resize:vertical;background:var(--surface);}

  .listedit-row{display:flex;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .listedit-row:last-child{border-bottom:none;}
  .listedit-row .slot{width:24px;font-size:11.5px;color:var(--ink-faint);font-weight:800;padding-top:9px;}
  .listedit-row input[type=text]{flex:2;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13.5px;}
  .listedit-row input[type=date]{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12.5px;}
  .listedit-row .datewrap{display:flex;flex-direction:column;gap:3px;}
  .listedit-row .datewrap label{font-size:10px;color:var(--ink-soft);font-weight:700;}
  .iconbtn{border:none;background:none;color:var(--red);padding:6px;border-radius:8px;}
  .iconbtn:hover{background:var(--red-soft);}
  .iconbtn .ic{width:17px;height:17px;}

  .studentpicker{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .studentpicker input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:14px;font-weight:700;text-align:center;color:var(--primary-deep);}
  .scoregrid{display:flex;flex-direction:column;}
  .scorerow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .scorerow:last-child{border-bottom:none;}
  .scorerow .no{width:24px;font-size:11.5px;color:var(--ink-faint);font-weight:700;text-align:center;}
  .scorerow .name{flex:1;font-size:14px;font-weight:700;}
  .scorerow input{width:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-weight:800;text-align:center;color:var(--primary-deep);}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;}
  .toast.show{opacity:.96;}

  .modalbg{position:fixed;inset:0;background:rgba(20,25,40,.42);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modalbox{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modalbox h3{font-size:17px;margin-bottom:14px;}
  .modalbox label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;}
  .modalbox label:first-of-type{margin-top:0;}
  .modalbox input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:14px;}
  .checkrow{display:flex;align-items:center;gap:9px;padding:9px 0;}
  .checkrow input{width:17px;height:17px;}
  .checkrow span{font-size:13.5px;font-weight:600;}
  .modalactions{display:flex;gap:10px;margin-top:20px;}
  .modalactions .btn{flex:1;justify-content:center;}

  .tagpicker{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 6px;}
  .tabbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;}
  .tabbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;}
  .tabbar button.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  @media(max-width:820px){
    main#app{padding:18px 14px 60px;}
    .teacherbox .who{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg></div>
    <h1>Sınıf Yönetim Panelim<span class="ver">v.1.0 · yerel</span></h1>
  </div>
  <div class="spacer"></div>
  <button class="teacherbox" id="teacherBtn">
    <div class="who"><div class="name" id="teacherNameLbl">Öğretmenim</div><div class="branch" id="teacherBranchLbl">Branş belirtilmedi</div></div>
    <div class="av" id="teacherAv">Ö</div>
  </button>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
// ============== ICONS ==============
const ICONS = {
  home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  school:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  flag:'<path d="M5 3v18"/><path d="M5 4h11l-2 4 2 4H5"/>',
  shield:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.9.5 5 2.5 5 5.8"/>',
  file:'<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/>',
  power:'<path d="M12 2v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  chevron:'<path d="m9 6 6 6-6 6"/>',
  trash:'<path d="M4 7h16"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/><path d="M9 7V4h6v3"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.3" width="6" height="3.2" rx="1"/><path d="M9 11h6M9 15h6"/>',
  download:'<path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>',
  upload:'<path d="M12 20V9"/><path d="m7 13 5-5 5 5"/><path d="M5 20h14"/>',
};
function ic(name){ return '<svg class="ic" viewBox="0 0 24 24">'+(ICONS[name]||'')+'</svg>'; }

// ============== DATA ==============
const STORAGE_KEY = 'ogretmen_panel_data_v1';
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

function makeStudents(names){
  return names.map((n,i)=>({id:uid('st'), no:String(i+1), name:n, note:''}));
}

function defaultData(){
  const s9a = makeStudents(['Ahmet Yılmaz','Ayşe Demir','Mehmet Kaya','Zeynep Şahin','Burak Aydın','Elif Çelik','Cem Öztürk','Selin Arslan']);
  const s10b = makeStudents(['Kerem Aksoy','Deniz Polat','İrem Koç','Ege Yıldırım','Sude Kurt','Barış Şen','Nil Aydoğan','Umut Kara']);
  const s12c = makeStudents(['Alper Güneş','Buse Yavuz','Doruk Er','Hazal Bulut','Kaan Türkmen','Melis Aktaş','Onur Şahin','Pelin Doğan']);

  function hwStatusFor(students, doneMap){
    const st = {};
    students.forEach((s,i)=>{ st[s.id] = { 1: !!doneMap[1] && doneMap[1].includes(i), 2: !!doneMap[2] && doneMap[2].includes(i) }; });
    return st;
  }
  function scoresFor(students, arr, slot){
    const sc = {};
    students.forEach((s,i)=>{ sc[s.id] = sc[s.id]||{}; sc[s.id][slot] = arr[i]; });
    return sc;
  }
  function mergeScores(a,b){ const r={}; Object.keys(a).forEach(k=>r[k]={...a[k]}); Object.keys(b).forEach(k=>{ r[k]=r[k]||{}; Object.assign(r[k], b[k]); }); return r; }

  const c9a = {
    id:'c9a', name:'9-A', hasHomework:true, hasTopicExam:true, hasDeneme:false,
    students: s9a,
    homeworks: [
      {slotNo:1, topic:'Bölme ve Bölünebilme Kuralları Soru Seti', hwDate:'2026-08-10', checkDate:'2026-08-17'},
      {slotNo:2, topic:'Cebirsel İfadeler ve Özdeşlikler', hwDate:'2026-08-17', checkDate:'2026-08-24'},
    ],
    hwStatus: hwStatusFor(s9a, {1:[0,1,3,4,6], 2:[0,2,5]}),
    topicExams: [{slotNo:1, label:'1. Konu Değerlendirme Sınavı (Sayılar)'}],
    topicScores: scoresFor(s9a, [78,85,64,92,70,58,88,75], 1),
    studentNote: {},
  };
  const c10b = {
    id:'c10b', name:'10-B', hasHomework:true, hasTopicExam:true, hasDeneme:false,
    students: s10b,
    homeworks: [
      {slotNo:1, topic:'Fonksiyonlarda Uygulama Soruları', hwDate:'2026-08-11', checkDate:'2026-08-18'},
      {slotNo:2, topic:'İkinci Dereceden Denklemler', hwDate:'2026-08-18', checkDate:'2026-08-24'},
    ],
    hwStatus: hwStatusFor(s10b, {1:[1,2,3,5,7], 2:[0,1,4]}),
    topicExams: [{slotNo:1, label:'1. Konu Değerlendirme Sınavı (Fonksiyonlar)'}],
    topicScores: scoresFor(s10b, [66,80,90,55,72,84,61,77], 1),
    studentNote: {},
  };
  const c12c = {
    id:'c12c', name:'12-C', hasHomework:false, hasTopicExam:false, hasDeneme:true,
    students: s12c,
    denemeExams: [{slotNo:1, label:'1. Deneme Sınavı'}, {slotNo:2, label:'2. Deneme Sınavı'}],
    denemeScores: mergeScores(
      scoresFor(s12c, [410,365,298,445,340,275,390,320], 1),
      scoresFor(s12c, [428,372,310,460,355,290,402,335], 2)
    ),
    studentNote: {},
  };

  return { teacherName:'Öğretmenim', teacherBranch:'', classes:[c9a, c10b, c12c] };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.error('loadData', e); }
  const d = defaultData();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
  catch(e){ showToast('Kaydedilemedi: tarayıcı depolama alanı hatası'); console.error(e); }
}

// ============== STATE ==============
let state = {
  data: loadData(),
  page: 'home',       // home | sinif_detail
  classId: null,
  view: 'roster',      // roster | student | homeworks | hw_picker | quick_hw | topicExams | topic_picker | quick_topic | denemeExams | deneme_picker | quick_deneme
  studentId: null,
  activeSlot: null,
  checkFrom: null,
  sortBy: 'no',
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return null; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function findClass(id){ return state.data.classes.find(c=>c.id===id); }
function findStudent(cls, id){ return cls.students.find(s=>s.id===id); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function sortedStudents(cls){
  return [...cls.students].sort((a,b)=>{
    if(state.sortBy==='name') return a.name.localeCompare(b.name,'tr');
    const na=parseInt(a.no), nb=parseInt(b.no);
    const va=isNaN(na)?Infinity:na, vb=isNaN(nb)?Infinity:nb;
    if(va!==vb) return va-vb;
    return a.name.localeCompare(b.name,'tr');
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1700);
}

// ============== HW / EXAM CALC ==============
function hwAssignedCount(cls){
  const today = todayStr();
  return cls.homeworks.filter(h=>h.checkDate && h.checkDate<=today).length;
}
function hwCompletedCount(cls, sid){
  const today = todayStr();
  const st = cls.hwStatus[sid] || {};
  let n=0;
  cls.homeworks.forEach(h=>{ if(h.checkDate && h.checkDate<=today && st[h.slotNo]) n++; });
  return n;
}
function hwPct(cls, sid){
  const a = hwAssignedCount(cls);
  if(a===0) return 0;
  return Math.round((hwCompletedCount(cls,sid)/a)*100);
}
function hwClassAvg(cls){
  const vals = cls.students.map(s=>hwPct(cls,s.id));
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function scoreAvgForStudent(scoreMap, sid){
  const rec = scoreMap[sid] || {};
  const vals = Object.values(rec).map(Number).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function examClassAvg(scoreMap, students, slotNo){
  const vals = students.map(s=>{ const v=parseFloat((scoreMap[s.id]||{})[slotNo]); return isNaN(v)?null:v; }).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModalHtml(innerHtml){
  document.getElementById('modalRoot').innerHTML = '<div class="modalbg" id="modalBg"><div class="modalbox">'+innerHtml+'</div></div>';
  document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };

  openModalHtml(

function openNewClassModal(){
  openModalHtml(
    '<h3>Yeni Sınıf Ekle</h3>' +
    '<label>Sınıf adı (örn. 11-D)</label><input type="text" id="mClassName" placeholder="Sınıf adı">' +
    '<label>Bu sınıfta neleri takip edeceksin?</label>' +

    '<div class="checkrow"><input type="checkbox" id="mHasTopic" checked><span>Konu değerlendirme sınavı sonuçları</span></div>' +
    '<div class="checkrow"><input type="checkbox" id="mHasDeneme"><span>Deneme sınavı puanları</span></div>' +
    '<div class="modalactions"><button class="btn btn-outline" id="mCancel">Vazgeç</button><button class="btn btn-primary" id="mSave">Sınıfı Oluştur</button></div>'
  );
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=>{
    const name = document.getElementById('mClassName').value.trim();
    if(!name){ showToast('Sınıf adı gerekli'); return; }
    const cls = {
      id: uid('cls'), name,
      hasHomework: document.getElementById('mHasHw').checked,
      hasTopicExam: document.getElementById('mHasTopic').checked,
      hasDeneme: document.getElementById('mHasDeneme').checked,
      students: [], homeworks: [], hwStatus: {}, topicExams: [], topicScores: {}, denemeExams: [], denemeScores: {}, studentNote: {},
    };
    state.data.classes.push(cls);
    saveData();
    closeModal();
    state.page='sinif_detail'; state.classId=cls.id; state.view='roster';
    render();
    showToast('"'+name+'" sınıfı oluşturuldu');
  };
}
