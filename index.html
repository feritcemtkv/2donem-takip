<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Odev Kontrol</title>
<style>
  :root{
    --navy:#1F4E78;
    --navy-deep:#123152;
    --navy-soft:#e8eef5;
    --accent:#c96a3c;
    --accent-soft:#f7e6dc;
    --good:#2f8f5b;
    --good-soft:#e3f3ea;
    --paper:#fbfaf7;
    --line:#e2e0d8;
    --ink:#25262b;
    --ink-soft:#6b6f76;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif; margin:0;}
  .num{font-variant-numeric:tabular-nums;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--navy); color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header.top .back{
    font-size:22px; line-height:1; padding:6px 10px; margin:-6px 0 -6px -10px;
    cursor:pointer; opacity:.9; border-radius:8px;
  }
  header.top .back:active{background:rgba(255,255,255,.15);}
  header.top h1{font-size:18px; font-weight:600; flex:1; letter-spacing:.2px;}
  header.top .sub{font-size:12px; opacity:.8; font-family:inherit;}

  .classbar{display:flex; gap:8px; padding:10px 14px; background:var(--navy-deep); overflow-x:auto;}
  .classbar button{border:none; background:rgba(255,255,255,.12); color:#fff; padding:9px 18px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap;}
  .classbar button.active{background:var(--accent); color:#fff;}

  main{padding:14px 14px 60px; max-width:720px; margin:0 auto;}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .studentcard{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .studentcard:active{background:#f5f4f0;}
  .studentcard .no{font-size:11px; color:var(--ink-soft); width:28px; flex-shrink:0; text-align:center;}
  .studentcard .name{flex:1; font-size:15.5px; font-weight:600;}
  .studentcard .pct{font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--navy-soft); color:var(--navy); min-width:44px; text-align:center;}
  .studentcard .pct.low{background:var(--accent-soft); color:var(--accent);}
  .studentcard .chev{color:var(--ink-soft); font-size:18px;}

  .sectiontitle{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); font-weight:700; margin:22px 0 8px; display:flex; align-items:center; gap:8px;}
  .sectiontitle:first-child{margin-top:4px;}
  .sectiontitle .line{flex:1; height:1px; background:var(--line);}

  .fab{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; font-size:28px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:15; display:flex; align-items:center; justify-content:center;}
  .fab:active{transform:scale(.94);}

  .infobar{display:flex; justify-content:space-between; align-items:center; background:var(--navy-soft); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:var(--navy);}
  .infobar b{font-size:16px;}

  .detail-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .field{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .field input{width:100%; border:none; text-align:center; font-size:16px; font-weight:700; color:var(--navy); background:transparent; font-family:inherit;}
  .field input:focus{outline:2px solid var(--navy); border-radius:6px;}

  .hwrow{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .hwrow:last-child{border-bottom:none;}
  .hwrow .topic{flex:1; cursor:pointer;}
  .hwrow .topic .t{font-size:14.5px; font-weight:600;}
  .hwrow .topic .d{font-size:12px; color:var(--ink-soft);}
  .hwrow.future .topic .t, .hwrow.future .topic .d{color:var(--ink-soft); font-style:italic;}

  .toggle{width:50px; height:30px; border-radius:999px; background:#dcdad2; position:relative; flex-shrink:0; border:none;}
  .toggle.on{background:var(--good);}
  .toggle .knob{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .knob{left:23px;}

  textarea.note{width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:inherit; font-size:14px; min-height:70px; resize:vertical; background:#fff;}

  .levelcard{border:2px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer;}
  .levelcard.sel{border-color:var(--good); background:var(--good-soft);}
  .levelcard .lh{display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-bottom:4px;}
  .levelcard .lh .score{color:var(--navy);}
  .levelcard .desc{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  .critblock{margin-bottom:20px;}
  .critblock h3{font-size:14.5px; margin-bottom:8px; color:var(--ink); font-family:inherit;}
  .critblock .max{font-size:12px; color:var(--ink-soft); font-weight:400;}

  .rubricsummary{display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff; border-radius:var(--radius); padding:14px 16px; margin:16px 0;}
  .rubricsummary .num{font-size:26px; font-weight:700;}
  .rubricsummary .lbl{font-size:11px; opacity:.8; text-transform:uppercase;}

  .levelpicker{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .levelpicker button{border:none; background:var(--navy-soft); color:var(--navy); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;}
  .levelpicker button.active{background:var(--navy); color:#fff;}

  .studentpicker{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .studentpicker button{border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:999px; font-size:13px; white-space:nowrap;}
  .studentpicker button.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}

  .rowline{display:flex; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
  .rowline:last-child{border-bottom:none;}
  .rowline .slot{width:26px; font-size:12px; color:var(--ink-soft); font-weight:700;}
  .rowline input[type=text]{flex:2; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; font-family:inherit;}
  .rowline input[type=date]{flex:1; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; font-family:inherit;}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty .big{font-size:38px; margin-bottom:8px;}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;}
  .toast.show{opacity:.95;}

  .loading{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .spin{width:28px; height:28px; border:3px solid var(--navy-soft); border-top-color:var(--navy); border-radius:50%; margin:0 auto 12px; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  a.linklike{color:var(--navy); font-weight:600; text-decoration:none; cursor:pointer;}
  .backlink{display:block; margin-bottom:14px; color:var(--navy); font-weight:600; text-decoration:none; font-size:14.5px; cursor:pointer;}

  .loginwrap{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .loginbox{width:100%; max-width:340px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .loginbox h2{font-size:20px; color:var(--navy); margin-bottom:4px; text-align:center;}
  .loginbox p.sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-bottom:20px;}
  .loginbox label{display:block; font-size:12px; color:var(--ink-soft); margin:14px 0 5px; font-weight:600;}
  .loginbox input{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:15px; font-family:inherit;}
  .loginbox button{width:100%; margin-top:20px; border:none; background:var(--navy); color:#fff; padding:13px; border-radius:10px; font-weight:700; font-size:15px;}
  .loginbox button:disabled{opacity:.6;}
  .loginbox .err{color:#b3432f; font-size:12.5px; margin-top:10px; text-align:center; min-height:16px;}
  .logoutlink{font-size:12px; color:rgba(255,255,255,.75); text-decoration:none; margin-left:auto; cursor:pointer;}
</style>
</head>
<body>

<header class="top" id="topbar">
  <div class="back" id="backBtn" style="visibility:hidden">&#8249;</div>
  <div style="flex:1">
    <h1 id="topTitle">Odev Kontrol</h1>
    <div class="sub" id="topSub"></div>
  </div>
  <a class="logoutlink" id="logoutLink" style="display:none;">Cikis</a>
</header>
<div id="welcomeBar" style="display:none; background:#fff; padding:8px 16px; font-size:12.5px; color:var(--ink-soft); border-bottom:1px solid var(--line);"></div>
<div class="classbar" id="classbar"></div>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://miekldpkuclbinclnvvu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pZWtsZHBrdWNsYmluY2xudnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDIxNDIsImV4cCI6MjEwMDk3ODE0Mn0.5e6xes30VH-aDrApuCwmFCI7GkteZe-X55sYGU039VQ';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

let state = {
  classes: [],
  cls: null,
  classId: null,
  userId: null,
  students: [],
  homeworks: [],
  hwStatus: {},
  rubrics: {},
  rubricScores: {},
  view: 'roster',
  currentStudentId: null,
  activeHwSlot: null,
  activeQuizSlot: null,
  rubricLevel: 'P1',
  rubricEdit: false,
  sortBy: 'no',
  loading: true,
};

const $app = document.getElementById('app');
const $classbar = document.getElementById('classbar');
const $topTitle = document.getElementById('topTitle');
const $topSub = document.getElementById('topSub');
const $backBtn = document.getElementById('backBtn');
const $toast = document.getElementById('toast');
const $logoutLink = document.getElementById('logoutLink');

function showToast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>$toast.classList.remove('show'), 1600);
}

function fmtDate(d){
  if(!d) return null;
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayStr(){
  const t = new Date();
  return t.toISOString().slice(0,10);
}

// ================= AUTH =================
function toEmail(username){
  username = username.trim();
  if(username.includes('@')) return username;
  return username + '@takip.local';
}

async function doLogin(username, password){
  const $err = document.getElementById('loginErr');
  const $btn = document.getElementById('loginBtn');
  $err.textContent = '';
  $btn.textContent = 'Giris yapiliyor...';
  $btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password });
  if(error){
    $err.textContent = 'Kullanici adi veya sifre hatali.';
    $btn.textContent = 'Giris Yap';
    $btn.disabled = false;
    return;
  }
  await startApp();
}

async function doLogout(){
  await sb.auth.signOut();
  $logoutLink.style.display = 'none';
  state.username = '';
  document.getElementById('welcomeBar').style.display = 'none';
  state.cls = null; state.classId = null; state.classes = []; state.students = [];
  renderLogin();
}

function renderLogin(){
  $classbar.innerHTML = '';
  $topTitle.textContent = 'Odev Kontrol';
  $topSub.textContent = '';
  $backBtn.style.visibility = 'hidden';
  $app.innerHTML =
    '<div class="loginwrap"><div class="loginbox">' +
      '<h2>Giris Yap</h2>' +
      '<p class="sub">Odev Kontrol uygulamasina erismek icin giris yapin</p>' +
      '<label>Kullanici Adi</label>' +
      '<input type="text" id="loginUser" autocapitalize="none" autocorrect="off">' +
      '<label>Sifre</label>' +
      '<input type="password" id="loginPass">' +
      '<button id="loginBtn">Giris Yap</button>' +
      '<div class="err" id="loginErr"></div>' +
    '</div></div>';
  const $user = document.getElementById('loginUser');
  const $pass = document.getElementById('loginPass');
  const submit = ()=> doLogin($user.value, $pass.value);
  document.getElementById('loginBtn').onclick = submit;
  $user.addEventListener('keydown', e=>{ if(e.key==='Enter') $pass.focus(); });
  $pass.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  setTimeout(()=>$user.focus(), 50);
}

async function startApp(){
  $logoutLink.style.display = 'inline';
  const { data: { user } } = await sb.auth.getUser();
  state.userId = user ? user.id : null;
  state.username = user && user.email ? user.email.split('@')[0] : '';
  state.userEmail = user ? user.email : '';
  state.isAdmin = state.userEmail === 'ferit@takip.local';
  await loadClasses();
  if(state.classes.length){
    await loadClass(state.classes[0].name);
  } else {
    state.loading = false;
    render();
  }
}

$logoutLink.onclick = doLogout;
// ================= /AUTH =================

async function loadClasses(){
  const { data } = await sb.from('classes').select('*').order('sort_order');
  state.classes = data || [];
  return state.classes;
}
async function addClass(name){
  name = name.trim();
  if(!name) return;
  if(state.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){
    showToast('Bu sinif zaten var'); return;
  }
  const maxOrder = Math.max(-1, ...state.classes.map(c=>c.sort_order||0));
  const { data, error } = await sb.from('classes').insert({name, sort_order:maxOrder+1, owner_id: state.userId}).select();
  if(error){ showToast('HATA: '+error.message); console.error('addClass error', error); return; }
  if(data && data[0]) state.classes.push(data[0]);
  await loadClass(name);
}
async function renameClass(oldName, newName){
  newName = newName.trim();
  if(!newName || newName===oldName) return;
  const c = state.classes.find(x=>x.name===oldName);
  if(!c) return;
  c.name = newName;
  await sb.from('classes').update({name:newName}).eq('id', c.id);
  state.cls = newName;
  render();
  showToast('Sinif adi guncellendi');
}
async function deleteClass(name){
  const c = state.classes.find(x=>x.name===name);
  state.classes = state.classes.filter(x=>x.name!==name);
  if(c) await sb.from('classes').delete().eq('id', c.id); // cascade siler: ogrenciler, odevler, quizler, rubrikler...
  showToast('Sinif silindi');
  const next = state.classes[0];
  if(next) await loadClass(next.name);
  else { state.cls=null; state.classId=null; state.students=[]; state.homeworks=[]; state.loading=false; render(); }
}

async function loadClass(cls){
  state.loading = true; render();
  const classObj = state.classes.find(c=>c.name===cls);
  if(!classObj){ state.loading=false; render(); return; }
  const classId = classObj.id;
  const { data: students } = await sb.from('students').select('*').eq('class_id',classId).order('sort_order');
  const { data: homeworks } = await sb.from('homeworks').select('*').eq('class_id',classId).order('slot_no');
  const { data: quizzes } = await sb.from('quizzes').select('*').eq('class_id',classId).order('slot_no');
  const { data: perfTasks } = await sb.from('performance_tasks').select('*').eq('class_id',classId).order('slot_no');
  const ids = (students||[]).map(s=>s.id);
  let hwStatusRows = [];
  let rubricScoreRows = [];
  let quizScoreRows = [];
  if(ids.length){
    const r1 = await sb.from('homework_status').select('*').in('student_id', ids);
    hwStatusRows = r1.data || [];
    const r2 = await sb.from('rubric_scores').select('*').in('student_id', ids);
    rubricScoreRows = r2.data || [];
    const r3 = await sb.from('quiz_scores').select('*').in('student_id', ids);
    quizScoreRows = r3.data || [];
  }
  const { data: rubricRows } = await sb.from('rubrics').select('*').eq('class_id', classId);

  const hwStatus = {};
  for(const row of hwStatusRows){
    hwStatus[row.student_id] = hwStatus[row.student_id] || {};
    hwStatus[row.student_id][row.slot_no] = row.done;
  }
  const rubricScores = {};
  for(const row of rubricScoreRows){
    rubricScores[row.student_id] = rubricScores[row.student_id] || {};
    rubricScores[row.student_id][row.level] = rubricScores[row.student_id][row.level] || {};
    rubricScores[row.student_id][row.level][row.criteria_index] = row.score;
  }
  const rubrics = {};
  for(const row of (rubricRows||[])){
    rubrics[row.level] = row.criteria;
  }
  const quizScores = {};
  for(const row of quizScoreRows){
    quizScores[row.student_id] = quizScores[row.student_id] || {};
    quizScores[row.student_id][row.slot_no] = row.score;
  }
  state.classId = classId;

  state.cls = cls;
  state.students = students || [];
  state.homeworks = homeworks || [];
  state.hwStatus = hwStatus;
  state.rubricScores = rubricScores;
  state.rubrics = rubrics;
  state.quizzes = quizzes || [];
  state.perfTasks = perfTasks || [];
  state.quizScores = quizScores;
  state.rubricLevel = (state.perfTasks[0] && state.perfTasks[0].label) || null;
  state.loading = false;
  render();
}

function assignedCount(){
  const today = todayStr();
  return state.homeworks.filter(h => h.check_date && h.check_date <= today).length;
}
function completedCount(studentId){
  const today = todayStr();
  const st = state.hwStatus[studentId] || {};
  let n = 0;
  for(const h of state.homeworks){
    if(h.check_date && h.check_date <= today && st[h.slot_no]) n++;
  }
  return n;
}
function pct(studentId){
  const a = assignedCount();
  if(a===0) return 0;
  return Math.round((completedCount(studentId)/a)*100);
}
function rubricTotal(studentId, level){
  const crit = state.rubrics[level] || [];
  const scores = (state.rubricScores[studentId]||{})[level] || {};
  let sum = 0, max = 0, any=false;
  crit.forEach((c,i)=>{
    max += c.max;
    if(scores[i]!=null){ sum += scores[i]; any=true; }
  });
  return { sum, max, grade: any? Math.round(sum/max*100) : null };
}
function studentById(id){ return state.students.find(s=>s.id===id); }

async function toggleAbsent(studentId){
  const s = studentById(studentId);
  if(!s) return;
  s.absent = !s.absent;
  render();
  await sb.from('students').update({absent: s.absent}).eq('id', studentId);
  showToast(s.absent ? 'Öğrenci okulda yok olarak işaretlendi' : 'Öğrenci aktif');
}

async function toggleHw(studentId, slotNo){
  const cur = !!(state.hwStatus[studentId]||{})[slotNo];
  const next = !cur;
  state.hwStatus[studentId] = state.hwStatus[studentId] || {};
  state.hwStatus[studentId][slotNo] = next;
  render();
  await sb.from('homework_status').upsert({student_id:studentId, slot_no:slotNo, done: next});
}
async function updateStudentField(studentId, field, value){
  const s = studentById(studentId);
  if(s) s[field] = value;
  await sb.from('students').update({[field]: value}).eq('id', studentId);
  showToast('Kaydedildi');
}
async function addPerfTask(label){
  const maxSlot = Math.max(0, ...state.perfTasks.map(t=>t.slot_no||0));
  const { data } = await sb.from('performance_tasks').insert({class_id:state.classId, slot_no:maxSlot+1, label}).select();
  if(data && data[0]) state.perfTasks.push(data[0]);
  state.rubricLevel = label;
  state.view = 'rubric';
  render();
  showToast('Performans gorevi eklendi');
}
async function renamePerfTask(oldLabel, newLabel){
  newLabel = newLabel.trim();
  if(!newLabel || newLabel===oldLabel) return;
  const t = state.perfTasks.find(x=>x.label===oldLabel);
  if(t) t.label = newLabel;
  if(state.rubrics[oldLabel]){ state.rubrics[newLabel] = state.rubrics[oldLabel]; delete state.rubrics[oldLabel]; }
  for(const sid in state.rubricScores){
    if(state.rubricScores[sid][oldLabel]){
      state.rubricScores[sid][newLabel] = state.rubricScores[sid][oldLabel];
      delete state.rubricScores[sid][oldLabel];
    }
  }
  state.rubricLevel = newLabel;
  render();
  await sb.from('performance_tasks').update({label:newLabel}).eq('class_id', state.classId).eq('label', oldLabel);
  await sb.from('rubrics').update({level:newLabel}).eq('class_id', state.classId).eq('level', oldLabel);

async function importStudentsFromExcel(file){
  if(!file) return;
  showToast('Dosya okunuyor...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length){ showToast('Dosya bos gorunuyor'); return; }

    // basliklari bul (No / Ad Soyad benzeri kelimeler)
    let startRow = 0;
    let noCol = 0, nameCol = 1, firstCol = -1, lastCol = -1;
    const header = rows[0].map(c=>String(c).toLocaleLowerCase('tr'));
    const looksLikeHeader = header.some(h=>h.includes('no')||h.includes('ad')||h.includes('isim')||h.includes('soyad'));
    if(looksLikeHeader){
      startRow = 1;
      header.forEach((h,i)=>{
        if(h.includes('no')) noCol = i;
        else if(h.includes('ad') && h.includes('soyad')) nameCol = i;
        else if(h.includes('ad') && firstCol===-1 && !h.includes('soyad')) firstCol = i;
        else if(h.includes('soyad')) lastCol = i;
      });
    }

    const maxOrder = Math.max(0, ...state.students.map(s=>s.sort_order||0));
    const newRows = [];
    let order = maxOrder;
    for(let r=startRow; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>String(c).trim()==='')) continue;
      const no = String(row[noCol]??'').trim();
      let name;
      if(firstCol>=0 && lastCol>=0){
        name = (String(row[firstCol]??'').trim()+' '+String(row[lastCol]??'').trim()).trim();
      } else {
        name = String(row[nameCol]??'').trim();
      }
      if(!name) continue;
      order++;
      newRows.push({class_id: state.classId, no: no||null, name, sort_order: order});
    }
    if(!newRows.length){ showToast('Ogrenci satiri bulunamadi'); return; }

    const { data, error } = await sb.from('students').insert(newRows).select();
    if(error){ showToast('Hata: '+error.message); return; }
    state.students = state.students.concat(data||[]);
    render();
    showToast(newRows.length+' ogrenci eklendi');
  }catch(err){
    showToast('Dosya okunamadi: '+err.message);
  }
}

function exportCSV() {
  if(!state.cls || !state.students.length) {
    showToast('Disa aktarilacak ogrenci yok');
    return;
  }
  let csv = '\uFEFF'; 
  let headers = ['No', 'Ad Soyad', 'Durum'];
  state.quizzes.forEach(q => headers.push(q.label));
  state.perfTasks.forEach(t => headers.push(t.label));
  headers.push('Odev Durumu (%)');
  headers.push('Ogretmen Notu');
  csv += headers.join(';') + '\n';
  
  const sorted = [...state.students].sort((a,b)=>{
    const na = parseInt(a.no), nb = parseInt(b.no);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    if(va!==vb) return va-vb;
    return a.name.localeCompare(b.name,'tr');
  });
  
  sorted.forEach(s => {
    let row = [];
    row.push(s.no || '');
    row.push(s.name || '');
    row.push(s.absent ? 'Okulda Yok' : 'Aktif');
    state.quizzes.forEach(q => {
      let val = (state.quizScores[s.id]||{})[q.slot_no] || '';
      row.push(val);
    });
    state.perfTasks.forEach(t => {
      let total = rubricTotal(s.id, t.label);
      row.push(total.grade != null ? total.grade : '');
    });
    row.push(pct(s.id));
    let note = s.teacher_note || '';
    note = note.replace(/"/g, '""');
    if(note.includes(';') || note.includes('\n') || note.includes('"')) {
      note = '"' + note + '"';
    }
    row.push(note);
    csv += row.join(';') + '\n';
  });
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = state.cls + '_Notlar_' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Excel (CSV) indirildi');
}

function lineChartSvg(points){
  const valid = points.filter(p=>!isNaN(p.value));
  if(valid.length < 2) return '';
  const W = 320, H = 140, padL = 28, padR = 12, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxV = 100, minV = 0;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xy = points.map((p,i)=>{
    const x = padL + i*stepX;
    const v = isNaN(p.value) ? null : p.value;
    const y = v==null ? null : padT + innerH - ((v-minV)/(maxV-minV))*innerH;
    return {x,y,v,label:p.label};
  });
  let path = '';
  xy.forEach((pt,i)=>{
    if(pt.y==null) return;
    path += (path===''?'M':'L') + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ' ';
  });
  const dots = xy.filter(pt=>pt.y!=null).map(pt=>
    '<circle cx="'+pt.x.toFixed(1)+'" cy="'+pt.y.toFixed(1)+'" r="3.5" fill="#1F4E78"/>' +
    '<text x="'+pt.x.toFixed(1)+'" y="'+(pt.y-9).toFixed(1)+'" font-size="10" fill="#1F4E78" text-anchor="middle" font-weight="700">'+Math.round(pt.v)+'</text>'
  ).join('');
  const labels = xy.map(pt=>
    '<text x="'+pt.x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#6b6f76" text-anchor="middle">'+escapeHtml((pt.label||'').slice(0,8))+'</text>'
  ).join('');
  const gridlines = [0,25,50,75,100].map(v=>{
    const y = padT + innerH - ((v-minV)/(maxV-minV))*innerH;
    return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#e2e0d8" stroke-width="1"/>';
  }).join('');
  return '<div class="card" style="padding:12px 8px;"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block;">' +
    gridlines + '<path d="'+path+'" fill="none" stroke="#1F4E78" stroke-width="2"/>' + dots + labels +
    '</svg></div>';
}

function progressBarsHtml(points){
  const rows = points.map(p=>{
    const v = p.value;
    const pct = v==null ? 0 : Math.max(0, Math.min(100, v));
    const color = v==null ? '#dcdad2' : (v>=60 ? 'var(--good)' : 'var(--accent)');
    return '<div style="margin-bottom:12px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;">' +
        '<span style="font-weight:600; color:var(--ink);">'+escapeHtml(p.label)+'</span>' +
        '<span style="font-weight:700; color:'+(v==null?'var(--ink-soft)':color)+';">'+(v!=null?Math.round(v):'-')+'</span>' +
      '</div>' +
      '<div style="background:#eceae3; border-radius:999px; height:10px; overflow:hidden;">' +
        '<div style="width:'+pct+'%; height:100%; background:'+color+'; border-radius:999px;"></div>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="card">'+rows+'</div>';
}

function classAvgCompareHtml(studentVal, classAvg, label){
  if(studentVal==null && classAvg==null) return '';
  const sv = studentVal==null ? 0 : studentVal;
  const cv = classAvg==null ? 0 : classAvg;
  const svColor = studentVal>=cv ? 'var(--good)' : 'var(--accent)';
  const row = (lbl, val, color)=>{
    const pct = val==null ? 0 : Math.max(0, Math.min(100,val));
    return '<div style="margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; color:var(--ink-soft);">' +
        '<span>'+lbl+'</span><span style="font-weight:700; color:'+color+';">'+(val!=null?Math.round(val):'-')+'</span>' +
      '</div>' +
      '<div style="background:#eceae3; border-radius:999px; height:9px; overflow:hidden;">' +
        '<div style="width:'+pct+'%; height:100%; background:'+color+'; border-radius:999px;"></div>' +
      '</div>' +
    '</div>';
  };
  return '<div class="card">' +
    '<div style="font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px; font-weight:700;">'+escapeHtml(label)+': Ogrenci vs Sinif Ortalamasi</div>' +
    row('Bu ogrenci', studentVal, svColor) +

}

function barChartSvg(points){
  const valid = points.filter(p=>p.value!=null);
  if(!valid.length) return '';
  const W = 320, H = 150, padL = 8, padR = 8, padT = 14, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = points.length;
  const gap = 10;
  const barW = Math.max(18, (innerW - gap*(n-1)) / n);
  const totalW = barW*n + gap*(n-1);
  const startX = padL + (innerW-totalW)/2;
  const bars = points.map((p,i)=>{
    const x = startX + i*(barW+gap);
    const v = p.value==null ? 0 : p.value;
    const h = (v/100)*innerH;
    const y = padT + innerH - h;
    const color = v>=60 ? '#2f8f5b' : '#c96a3c';
    return (p.value!=null ?
      '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="'+color+'"/>' +
      '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" font-size="11" fill="'+color+'" text-anchor="middle" font-weight="700">'+Math.round(v)+'</text>'
      : '<rect x="'+x.toFixed(1)+'" y="'+(padT+innerH-2)+'" width="'+barW.toFixed(1)+'" height="2" fill="#e2e0d8"/>') +
      '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-10)+'" font-size="9" fill="#6b6f76" text-anchor="middle">'+escapeHtml((p.label||'').slice(0,10))+'</text>';
  }).join('');
  return '<div class="card" style="padding:12px 8px; width:50%; margin:0 auto;"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%; height:auto; display:block;">'+bars+'</svg></div>';
}

function perfTaskClassAverage(label){
  const vals = state.students.map(s=>rubricTotal(s.id,label).grade).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function overallQuizClassAverage(){
  const vals = [];
  state.students.forEach(s=>{
    state.quizzes.forEach(q=>{
      const v = parseFloat((state.quizScores[s.id]||{})[q.slot_no]);
      if(!isNaN(v)) vals.push(v);
    });
  });
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}

function overallPerfClassAverage(){
  const vals = [];
  state.students.forEach(s=>{
    state.perfTasks.forEach(t=>{
      const g = rubricTotal(s.id,t.label).grade;
      if(g!=null) vals.push(g);
    });
  });
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}

function quizClassAverage(slotNo){
  const vals = state.students.map(s=>parseFloat((state.quizScores[s.id]||{})[slotNo])).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}

function renderQuickQuiz(){
  removeFab();
  const slotNo = state.activeQuizSlot;
  const q = state.quizzes.find(x=>x.slot_no===slotNo);
  if(!q){ state.view='quizzes'; return render(); }

  const sorted = [...state.students].sort((a,b)=>{
    const na = parseInt(a.no), nb = parseInt(b.no);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    if(va!==vb) return va-vb;
    return a.name.localeCompare(b.name,'tr');
  });

  const listHtml = sorted.map(s=>{
    const val = (state.quizScores[s.id]||{})[slotNo] || '';

      '<div class="no">'+(s.no||'')+'</div>' +
      '<div class="name" style="flex:1; font-size:15px; font-weight:600;">'+absentTag+escapeHtml(s.name)+'</div>' +

          '<div><div class="lbl">Not</div><div class="num">'+(totals.grade!=null?totals.grade:'-')+'</div></div>' +
        '</div>' + critHtml
        : ''));

    $app.querySelectorAll('[data-sumid]').forEach(el=>{
      el.onclick = ()=>{
        state.currentStudentId = el.dataset.sumid;

}

async function loadAdminClassDetail(classId){
  state.loading = true; render();
  const { data: students } = await sb.from('students').select('*').eq('class_id', classId).order('sort_order');
  const { data: homeworks } = await sb.from('homeworks').select('*').eq('class_id', classId).order('slot_no');
  const ids = (students||[]).map(s=>s.id);
  let hwStatusRows = [];
  if(ids.length){
    const r = await sb.from('homework_status').select('*').in('student_id', ids);
    hwStatusRows = r.data || [];
  }
  const hwStatus = {};
  for(const row of hwStatusRows){
    hwStatus[row.student_id] = hwStatus[row.student_id] || {};
    hwStatus[row.student_id][row.slot_no] = row.done;
  }
  state.adminStudents = students || [];
  state.adminHomeworks = homeworks || [];
  state.adminHwStatus = hwStatus;
  state.loading = false;
  render();
}

    '<div class="sectiontitle"><span>Ogrenciler (salt okunur)</span><span class="line"></span></div>' +
    (rows || '<div class="empty">Ogrenci yok.</div>');
  document.getElementById('toAdminClasses').onclick = ()=>{ state.view='admin_classes'; render(); };
  $app.querySelectorAll('[data-student]').forEach(el=>{
    el.onclick = ()=>{
      state.adminStudent = state.adminStudents.find(s=>s.id===el.dataset.student);
      state.view = 'admin_student';
      render();
      loadAdminStudentDetail(el.dataset.student);
    };
  });
}

async function loadAdminStudentDetail(studentId){
  state.loading = true; render();
  const { data: quizzes } = await sb.from('quizzes').select('*').eq('class_id', state.adminClass.id).order('slot_no');
  const { data: perfTasks } = await sb.from('performance_tasks').select('*').eq('class_id', state.adminClass.id).order('slot_no');
  const { data: quizScoreRows } = await sb.from('quiz_scores').select('*').eq('student_id', studentId);
  const { data: rubricScoreRows } = await sb.from('rubric_scores').select('*').eq('student_id', studentId);
  const { data: rubricRows } = await sb.from('rubrics').select('*').eq('class_id', state.adminClass.id);

  const quizScores = {};
  (quizScoreRows||[]).forEach(r=>{ quizScores[r.slot_no] = r.score; });
  const rubricCrit = {};
  (rubricRows||[]).forEach(r=>{ rubricCrit[r.level] = r.criteria; });
  const rubricScores = {};
  (rubricScoreRows||[]).forEach(r=>{
    rubricScores[r.level] = rubricScores[r.level] || {};
    rubricScores[r.level][r.criteria_index] = r.score;
  });

  state.adminQuizzes = quizzes || [];
  state.adminPerfTasks = perfTasks || [];
  state.adminQuizScores = quizScores;
  state.adminRubricCrit = rubricCrit;
  state.adminRubricScores = rubricScores;
  state.loading = false;
  render();
}

function renderAdminStudent(){
  removeFab();
  const s = state.adminStudent;
  const today = todayStr();

  const quizHtml = state.adminQuizzes.map(q=>
    '<div class="field"><label>'+escapeHtml(q.label)+'</label><div class="num" style="font-size:15px;font-weight:700;color:var(--navy)">'+(state.adminQuizScores[q.slot_no]||'-')+'</div></div>'
  ).join('');

  const perfHtml = state.adminPerfTasks.map(t=>{
    const crit = state.adminRubricCrit[t.label] || [];
    const scores = state.adminRubricScores[t.label] || {};
    let sum=0, max=0, any=false;
    crit.forEach((c,i)=>{ max+=c.max; if(scores[i]!=null){ sum+=scores[i]; any=true; } });
    const grade = any ? Math.round(sum/max*100) : null;
    return '<div class="field"><label>'+escapeHtml(t.label)+'</label><div class="num" style="font-size:15px;font-weight:700;color:var(--navy)">'+(grade??'-')+'</div></div>';
  }).join('');

  const hwRows = state.adminHomeworks.map(h=>{
    const future = !h.check_date || h.check_date > today;
    const done = !!(state.adminHwStatus[s.id]||{})[h.slot_no];
    const topic = h.topic || ('(Odev '+h.slot_no+' tanimlanmadi)');
    return '<div class="hwrow '+(future?'future':'')+'">' +
      '<div class="topic"><div class="t">'+escapeHtml(topic)+'</div>' +
        '<div class="d">'+(h.hw_date?('Verildi: '+fmtDate(h.hw_date)):'')+(h.check_date?(' &middot; Kontrol: '+fmtDate(h.check_date)):'')+'</div></div>' +
      '<div style="width:50px; height:30px; border-radius:999px; background:'+(done?'var(--good)':'#dcdad2')+'; position:relative; flex-shrink:0;">' +
        '<span style="position:absolute; top:3px; '+(done?'left:23px':'left:3px')+'; width:24px; height:24px; border-radius:50%; background:#fff;"></span>' +
      '</div>' +
    '</div>';
  }).join('');

  $app.innerHTML =
    '<a class="backlink" id="toAdminClass">&lsaquo; '+escapeHtml(state.adminClass.name)+' listesine don</a>' +
    '<div class="infobar" style="background:var(--accent-soft); color:var(--accent); font-weight:700; justify-content:center;">Salt okunur goruntuleme - degisiklik yapilamaz</div>' +
    (s.no ? '<p style="font-size:12.5px; color:var(--ink-soft); margin:8px 0 0;">No: '+escapeHtml(s.no)+'</p>' : '') +
    (state.adminQuizzes.length ? '<div class="sectiontitle"><span>Mini Sinav Notlari</span><span class="line"></span></div><div class="detail-grid">'+quizHtml+'</div>' : '') +
    (state.adminPerfTasks.length ? '<div class="sectiontitle"><span>Performans</span><span class="line"></span></div><div class="detail-grid">'+perfHtml+'</div>' : '') +
    '<div class="sectiontitle"><span>Odev Gecmisi</span><span class="line"></span></div>' +
    '<div class="card">'+(hwRows||'<div class="empty">Odev yok.</div>')+'</div>' +
    (s.teacher_note ? '<div class="sectiontitle"><span>Ogretmen Notu</span><span class="line"></span></div><div class="card" style="font-size:13.5px; color:var(--ink);">'+escapeHtml(s.teacher_note)+'</div>' : '');

  document.getElementById('toAdminClass').onclick = ()=>{ state.view='admin_class'; render(); };
}
// ================= /ADMIN =================

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await startApp();
  } else {
    renderLogin();
  }
  sb.auth.onAuthStateChange((event, newSession) => {
    if(event === 'SIGNED_OUT'){
      $logoutLink.style.display = 'none';
    }
  });
})();
</script>
