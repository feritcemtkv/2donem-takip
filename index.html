<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sınıf Yönetim Panelim</title>
<style>
  :root{
    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface-2:#eef1f8;
    --ink:#1b2436;
    --ink-soft:#6b7280;
    --ink-faint:#9aa1b2;
    --line:#e3e7f0;
    --primary:#3457d5;
    --primary-deep:#233c9e;
    --primary-soft:#e8edfc;
    --amber:#c97a1f;
    --amber-soft:#faf0dd;
    --teal:#0f9d8c;
    --teal-soft:#e1f5f2;
    --red:#d24b4b;
    --red-soft:#fbe8e8;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px -14px rgba(20,25,40,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  h1,h2,h3,h4{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:#fff;}
  .brand .logo .ic{width:22px;height:22px;stroke:#fff;}
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:.1px;}
  .brand .ver{font-size:10.5px;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:700;vertical-align:2px;}
  header.top .spacer{flex:1;}
  .teacherbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);padding:6px 8px 6px 14px;border-radius:999px;cursor:pointer;border:none;}
  .teacherbox .who{text-align:right;line-height:1.25;}
  .teacherbox .name{font-size:13px;font-weight:700;color:var(--ink);}
  .teacherbox .branch{font-size:11px;color:var(--red);font-weight:700;}
  .teacherbox .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

  main#app{padding:26px 30px 70px;max-width:1180px;margin:0 auto;}

  .crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .pagehead h2{font-size:22px;font-weight:800;}
  .pagehead .sub{color:var(--ink-soft);font-size:13px;}
  .pagehead .spacer{flex:1;}
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary-deep);font-weight:700;text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:12px;border:none;background:none;padding:0;}

  .btn{border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-soft{background:var(--primary-soft);color:var(--primary-deep);}
  .btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.full{width:100%;justify-content:center;}

  .section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-title .line{flex:1;height:1px;background:var(--line);}
  .section-title:first-child{margin-top:0;}

  .classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .classcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;box-shadow:var(--shadow);border-top:4px solid var(--primary);}
  .classcard h3{font-size:19px;margin-bottom:4px;}
  .classcard .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.blue{background:var(--primary-soft);color:var(--primary-deep);}
  .tag.amber{background:var(--amber-soft);color:var(--amber);}
  .tag.teal{background:var(--teal-soft);color:var(--teal);}
  .addcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;color:var(--ink-soft);font-weight:700;font-size:13.5px;min-height:118px;background:transparent;}
  .addcard:hover{border-color:var(--primary);color:var(--primary-deep);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .infobar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--primary-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;}
  .infobar .item .v{font-size:19px;font-weight:800;color:var(--primary-deep);}
  .infobar .item .k{font-size:11.5px;color:var(--primary-deep);opacity:.75;font-weight:700;}

  .actionrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .actionrow .btn{flex:1;min-width:170px;justify-content:center;}

  .rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .rowcard .no{font-size:11.5px;color:var(--ink-faint);width:24px;flex-shrink:0;text-align:center;font-weight:700;}
  .rowcard .name{flex:1;font-size:14.5px;font-weight:700;}
  .rowcard .pct{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);min-width:46px;text-align:center;}
  .rowcard .pct.low{background:var(--red-soft);color:var(--red);}
  .rowcard .pct.mid{background:var(--amber-soft);color:var(--amber);}
  .rowcard .chev{color:var(--ink-faint);}
  .rowcard .chev .ic{width:16px;height:16px;}

  .field{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center;}
  .field label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .field input{width:100%;border:none;background:transparent;text-align:center;font-size:15px;font-weight:800;color:var(--primary-deep);}
  .field input:focus{outline:2px solid var(--primary);border-radius:6px;}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}

  .hwrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .hwrow:last-child{border-bottom:none;}
  .hwrow .topic{flex:1;}
  .hwrow .topic .t{font-size:14px;font-weight:700;}
  .hwrow .topic .d{font-size:11.5px;color:var(--ink-soft);}
  .hwrow.future .topic .t,.hwrow.future .topic .d{color:var(--ink-faint);font-style:italic;}

  .toggle{width:48px;height:28px;border-radius:999px;background:#dfe3ee;position:relative;flex-shrink:0;border:none;}
  .toggle.on{background:var(--teal);}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.28);}
  .toggle.on .knob{left:23px;}
  .toggle:disabled{opacity:.4;}

  textarea.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;min-height:70px;resize:vertical;background:var(--surface);}

  .listedit-row{display:flex;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .listedit-row:last-child{border-bottom:none;}
  .listedit-row .slot{width:24px;font-size:11.5px;color:var(--ink-faint);font-weight:800;padding-top:9px;}
  .listedit-row input[type=text]{flex:2;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13.5px;}
  .listedit-row input[type=date]{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12.5px;}
  .listedit-row .datewrap{display:flex;flex-direction:column;gap:3px;}
  .listedit-row .datewrap label{font-size:10px;color:var(--ink-soft);font-weight:700;}
  .iconbtn{border:none;background:none;color:var(--red);padding:6px;border-radius:8px;}
  .iconbtn:hover{background:var(--red-soft);}
  .iconbtn .ic{width:17px;height:17px;}

  .scoregrid{display:flex;flex-direction:column;}
  .scorerow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .scorerow:last-child{border-bottom:none;}
  .scorerow .no{width:24px;font-size:11.5px;color:var(--ink-faint);font-weight:700;text-align:center;}
  .scorerow .name{flex:1;font-size:14px;font-weight:700;}
  .scorerow input{width:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-weight:800;text-align:center;color:var(--primary-deep);}

  .levelpicker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .levelpicker button{border:none;background:var(--primary-soft);color:var(--primary-deep);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;}
  .levelpicker button.active{background:var(--primary);color:#fff;}
  .levelcard{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;}
  .levelcard.sel{border-color:var(--teal);background:var(--teal-soft);}
  .levelcard .lh{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px;}
  .levelcard .lh .score{color:var(--primary-deep);}
  .levelcard .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .critblock{margin-bottom:20px;}
  .critblock h3{font-size:14.5px;margin-bottom:8px;color:var(--ink);}
  .critblock .max{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .rubricsummary{display:flex;justify-content:space-between;align-items:center;background:var(--primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin:16px 0;}
  .rubricsummary .num{font-size:26px;font-weight:800;}
  .rubricsummary .lbl{font-size:11px;opacity:.8;text-transform:uppercase;}
  .studentpicker{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .studentpicker button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;}
  .studentpicker button.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;}
  .toast.show{opacity:.96;}

  .modalbg{position:fixed;inset:0;background:rgba(20,25,40,.42);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modalbox{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modalbox h3{font-size:17px;margin-bottom:14px;}
  .modalbox label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;}
  .modalbox label:first-of-type{margin-top:0;}
  .modalbox input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:14px;}
  .modalactions{display:flex;gap:10px;margin-top:20px;}
  .modalactions .btn{flex:1;justify-content:center;}

  .loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--shadow);}
  .loginbox h2{font-size:21px;color:var(--ink);margin-bottom:4px;text-align:center;}
  .loginbox p.sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:22px;}
  .loginbox label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 6px;font-weight:700;}
  .loginbox label:first-of-type{margin-top:0;}
  .loginbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px;font-family:inherit;}
  .loginbox button{width:100%;margin-top:20px;justify-content:center;}
  .loginbox .err{color:var(--red);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}

  @media(max-width:820px){
    main#app{padding:18px 14px 60px;}
    .teacherbox .who{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg></div>
    <h1>Sınıf Yönetim Panelim<span class="ver">v.2.3 · bulut</span></h1>
  </div>
  <div class="spacer"></div>
  <button class="teacherbox" id="teacherBtn" style="display:none;">
    <div class="who"><div class="name" id="teacherNameLbl"></div><div class="branch">Çıkış Yap</div></div>
    <div class="av" id="teacherAv"></div>
  </button>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://miekldpkuclbinclnvvu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pZWtsZHBrdWNsYmluY2xudnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDIxNDIsImV4cCI6MjEwMDk3ODE0Mn0.5e6xes30VH-aDrApuCwmFCI7GkteZe-X55sYGU039VQ';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const ICONS = {
  home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  school:'<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  flag:'<path d="M5 3v18"/><path d="M5 4h11l-2 4 2 4H5"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.9.5 5 2.5 5 5.8"/>',
  file:'<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  chevron:'<path d="m9 6 6 6-6 6"/>',
  trash:'<path d="M4 7h16"/><path d="M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/><path d="M9 7V4h6v3"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.3" width="6" height="3.2" rx="1"/><path d="M9 11h6M9 15h6"/>',
  upload:'<path d="M12 20V9"/><path d="m7 13 5-5 5 5"/><path d="M5 20h14"/>',
};
function ic(name){ return '<svg class="ic" viewBox="0 0 24 24">'+(ICONS[name]||'')+'</svg>'; }

let state = {
  userId: null, username: null, userEmail: null,
  page: 'login',
  classes: [], classId: null, cls: null,
  view: 'roster',
  studentId: null,
  activeSlot: null, checkFrom: null,
  sortBy: 'no',
  rubricLevel: null, rubricEdit: false,
  examType: null, activeExamId: null,
  loading: false,
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return null; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function studentById(id){ return state.cls.students.find(s=>s.id===id); }
function sortedStudents(){
  return [...state.cls.students].sort((a,b)=>{
    if(state.sortBy==='name') return a.name.localeCompare(b.name,'tr');
    const na=parseInt(a.no), nb=parseInt(b.no);
    const va=isNaN(na)?Infinity:na, vb=isNaN(nb)?Infinity:nb;
    if(va!==vb) return va-vb;
    return a.name.localeCompare(b.name,'tr');
  });
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1700);
}
function isGrade12(name){ name = name || (state.cls?state.cls.name:''); return /12/.test(name); }
function examWord(name){ return isGrade12(name) ? 'Deneme' : 'KDS'; }
function examWordPlural(name){ return isGrade12(name) ? 'Denemeleri' : "KDS'leri"; }

function toEmail(username){
  username = username.trim();
  if(username.includes('@')) return username;
  return username + '@takip.local';
}
async function doLogin(username, password){
  const $err = document.getElementById('loginErr');
  const $btn = document.getElementById('loginBtn');
  $err.textContent = '';
  $btn.textContent = 'Giriş yapılıyor...'; $btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password });
  if(error){
    $err.textContent = 'Kullanıcı adı veya şifre hatalı.';
    $btn.textContent = 'Giriş Yap'; $btn.disabled = false;
    return;
  }
  await startApp();
}
async function doLogout(){
  await sb.auth.signOut();
  state.userId = null; state.username = null; state.userEmail = null;
  state.classes = []; state.classId = null; state.cls = null;
  state.page = 'login';
  document.getElementById('teacherBtn').style.display = 'none';
  render();
}
async function startApp(){
  const { data: { user } } = await sb.auth.getUser();
  state.userId = user ? user.id : null;
  state.userEmail = user ? user.email : null;
  state.username = user && user.email ? user.email.split('@')[0] : '';
  document.getElementById('teacherBtn').style.display = 'flex';
  document.getElementById('teacherNameLbl').textContent = state.username;
  document.getElementById('teacherAv').textContent = (state.username||'?').trim().charAt(0).toUpperCase();
  state.page = 'home';
  state.loading = true; render();
  await loadClasses();
  state.loading = false;
  render();
}
document.getElementById('teacherBtn').onclick = ()=>{
  if(confirm('Çıkış yapmak istediğine emin misin?')) doLogout();
};

function renderLogin(app){
  app.innerHTML =
    '<div class="loginwrap"><div class="loginbox">' +
      '<h2>Giriş Yap</h2>' +
      '<p class="sub">Sınıf panelinize erişmek için giriş yapın</p>' +
      '<label>Kullanıcı Adı</label>' +
      '<input type="text" id="loginUser" autocapitalize="none" autocorrect="off">' +
      '<label>Şifre</label>' +
      '<input type="password" id="loginPass">' +
      '<button class="btn btn-primary" id="loginBtn">Giriş Yap</button>' +
      '<div class="err" id="loginErr"></div>' +
    '</div></div>';
  const $user = document.getElementById('loginUser');
  const $pass = document.getElementById('loginPass');
  const submit = ()=> doLogin($user.value, $pass.value);
  document.getElementById('loginBtn').onclick = submit;
  $user.addEventListener('keydown', e=>{ if(e.key==='Enter') $pass.focus(); });
  $pass.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  setTimeout(()=>$user.focus(), 50);
}

async function logActivity(description){
  if(!state.userId) return;
  try{ await sb.from('activity_log').insert({ user_id: state.userId, class_name: state.cls?state.cls.name:null, description }); }
  catch(e){ console.error('logActivity error', e); }
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModalHtml(innerHtml){
  document.getElementById('modalRoot').innerHTML = '<div class="modalbg" id="modalBg"><div class="modalbox">'+innerHtml+'</div></div>';
  document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
}
function openNewClassModal(){
  openModalHtml(
    '<h3>Yeni Sınıf Ekle</h3>' +
    '<label>Sınıf adı (örn. 11-D)</label><input type="text" id="mClassName" placeholder="Sınıf adı">' +
    '<div class="modalactions"><button class="btn btn-outline" id="mCancel">Vazgeç</button><button class="btn btn-primary" id="mSave">Sınıfı Oluştur</button></div>'
  );
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = ()=> addClass(document.getElementById('mClassName').value);
}

async function addClass(name){
  name = name.trim();
  if(!name) return;
  if(state.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('Bu sınıf zaten var'); return; }
  const maxOrder = Math.max(-1, ...state.classes.map(c=>c.sort_order||0));
  const { data, error } = await sb.from('classes').insert({name, sort_order:maxOrder+1, owner_id: state.userId}).select();

async function loadClassDetail(classId){
  state.loading = true; render();
  const classObj = state.classes.find(c=>c.id===classId);
  const { data: students } = await sb.from('students').select('*').eq('class_id',classId).order('sort_order');
  const { data: homeworks } = await sb.from('homeworks').select('*').eq('class_id',classId).order('slot_no');
  const { data: quizzes } = await sb.from('quizzes').select('*').eq('class_id',classId).order('slot_no');
  const { data: perfTasks } = await sb.from('performance_tasks').select('*').eq('class_id',classId).order('slot_no');
  const { data: denemeExams } = await sb.from('deneme_exams').select('*').eq('class_id',classId).order('slot_no');
  const ids = (students||[]).map(s=>s.id);
  let hwStatusRows=[], rubricScoreRows=[], quizScoreRows=[], denemeScoreRows=[];
  if(ids.length){
    const r1 = await sb.from('homework_status').select('*').in('student_id', ids); hwStatusRows = r1.data||[];
    const r2 = await sb.from('rubric_scores').select('*').in('student_id', ids); rubricScoreRows = r2.data||[];
    const r3 = await sb.from('quiz_scores').select('*').in('student_id', ids); quizScoreRows = r3.data||[];
  }
  const examIds = (denemeExams||[]).map(e=>e.id);
  if(examIds.length){
    const r4 = await sb.from('deneme_scores').select('*').in('exam_id', examIds); denemeScoreRows = r4.data||[];
  }
  const { data: rubricRows } = await sb.from('rubrics').select('*').eq('class_id', classId);
  const hwStatus = {};
  for(const row of hwStatusRows){ hwStatus[row.student_id]=hwStatus[row.student_id]||{}; hwStatus[row.student_id][row.slot_no]=row.done; }
  const rubricScores = {};
  for(const row of rubricScoreRows){ rubricScores[row.student_id]=rubricScores[row.student_id]||{}; rubricScores[row.student_id][row.level]=rubricScores[row.student_id][row.level]||{}; rubricScores[row.student_id][row.level][row.criteria_index]=row.score; }
  const rubrics = {};
  for(const row of (rubricRows||[])){ rubrics[row.level]=row.criteria; }
  const quizScores = {};
  for(const row of quizScoreRows){
    quizScores[row.student_id]=quizScores[row.student_id]||{};
    quizScores[row.student_id][row.slot_no]={ dogru: row.dogru, yanlis: row.yanlis, bos: row.bos, score: row.score };
  }
  const denemeScoresByExam = {};
  for(const row of denemeScoreRows){
    denemeScoresByExam[row.exam_id] = denemeScoresByExam[row.exam_id]||{};
    denemeScoresByExam[row.exam_id][row.student_id] = denemeScoresByExam[row.exam_id][row.student_id]||{};
    denemeScoresByExam[row.exam_id][row.student_id][row.subject] = { dogru: row.dogru, yanlis: row.yanlis, bos: row.bos };
  }
  state.cls = {
    id: classId, name: classObj?classObj.name:'',
    students: students||[], homeworks: homeworks||[], hwStatus,
    quizzes: quizzes||[], quizScores,
    perfTasks: perfTasks||[], rubrics, rubricScores,
    tytExams: (denemeExams||[]).filter(e=>e.exam_type==='tyt'),
    aytExams: (denemeExams||[]).filter(e=>e.exam_type==='ayt'),
    denemeScoresByExam,
  };
  state.rubricLevel = (state.cls.perfTasks[0] && state.cls.perfTasks[0].label) || null;
  state.loading = false;
  render();
}

function assignedCount(){ const today=todayStr(); return state.cls.homeworks.filter(h=>h.check_date && h.check_date<=today).length; }
function completedCount(sid){ const today=todayStr(); const st=state.cls.hwStatus[sid]||{}; let n=0; state.cls.homeworks.forEach(h=>{ if(h.check_date && h.check_date<=today && st[h.slot_no]) n++; }); return n; }
function hwPct(sid){ const a=assignedCount(); if(a===0) return 0; return Math.round((completedCount(sid)/a)*100); }
function hwClassAvg(){ const vals=state.cls.students.map(s=>hwPct(s.id)); if(!vals.length) return null; return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); }
function rubricTotal(sid, level){
  const crit=state.cls.rubrics[level]||[];
  const scores=(state.cls.rubricScores[sid]||{})[level]||{};
  let sum=0,max=0,any=false;
  crit.forEach((c,i)=>{ max+=c.max; if(scores[i]!=null){ sum+=scores[i]; any=true; } });
  return {sum,max,grade: any?Math.round(sum/max*100):null};
}
function perfTaskAvg(label){
  const vals = state.cls.students.map(s=>rubricTotal(s.id,label).grade).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function perfClassAvg(){
  const vals=[];
  state.cls.students.forEach(s=>{ state.cls.perfTasks.forEach(t=>{ const g=rubricTotal(s.id,t.label).grade; if(g!=null) vals.push(g); }); });
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function quizSlotAvgDYB(slotNo){
  const entries = state.cls.students.map(s=>(state.cls.quizScores[s.id]||{})[slotNo]).filter(v=>v && (v.dogru!=null||v.yanlis!=null||v.bos!=null));
  if(!entries.length) return null;
  const avg = (key)=>{
    const vals = entries.map(e=>e[key]).filter(v=>v!=null);
    if(!vals.length) return null;
    return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
  };
  return { dogru: avg('dogru'), yanlis: avg('yanlis'), bos: avg('bos') };
}

async function importStudentsFromExcel(file){
  if(!file) return;
  showToast('Dosya okunuyor...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length){ showToast('Dosya boş görünüyor'); return; }
    let startRow=0, noCol=0, nameCol=1, firstCol=-1, lastCol=-1;
    const header = rows[0].map(c=>String(c).toLocaleLowerCase('tr'));
    const looksLikeHeader = header.some(h=>h.includes('no')||h.includes('ad')||h.includes('isim')||h.includes('soyad'));
    if(looksLikeHeader){
      startRow=1;
      header.forEach((h,i)=>{
        if(h.includes('no')) noCol=i;
        else if(h.includes('ad') && h.includes('soyad')) nameCol=i;
        else if(h.includes('ad') && firstCol===-1 && !h.includes('soyad')) firstCol=i;
        else if(h.includes('soyad')) lastCol=i;
      });
    }
    const maxOrder = Math.max(0, ...state.cls.students.map(s=>s.sort_order||0));
    const newRows = []; let order = maxOrder;
    for(let r=startRow; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>String(c).trim()==='')) continue;
      const no = String(row[noCol]??'').trim();
      let name;
      if(firstCol>=0 && lastCol>=0){ name=(String(row[firstCol]??'').trim()+' '+String(row[lastCol]??'').trim()).trim(); }
      else { name = String(row[nameCol]??'').trim(); }
      if(!name) continue;
      order++;
      newRows.push({class_id: state.cls.id, no: no||null, name, sort_order: order});
    }
    if(!newRows.length){ showToast('Öğrenci satırı bulunamadı'); return; }
    const { data, error } = await sb.from('students').insert(newRows).select();
    if(error){ showToast('Hata: '+error.message); return; }
    state.cls.students = state.cls.students.concat(data||[]);
    render();
    logActivity('Excelden '+newRows.length+' öğrenci ekledi');
    showToast(newRows.length+' öğrenci eklendi');
  }catch(err){ showToast('Dosya okunamadı: '+err.message); }
}

async function importQuizScoresFromExcel(file, slotNo){
  if(!file) return;
  showToast('Dosya okunuyor...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length){ showToast('Dosya boş görünüyor'); return; }
    let startRow = 0;
    const header = rows[0].map(c=>String(c).toLocaleLowerCase('tr'));
    const looksLikeHeader = header.some(h=>h.includes('no')||h.includes('doğru')||h.includes('dogru'));
    if(looksLikeHeader) startRow = 1;
    const byNo = {};
    state.cls.students.forEach(s=>{ if(s.no) byNo[String(s.no).trim()] = s; });
    let matched = 0, unmatched = 0;
    const upserts = [];
    for(let r=startRow; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>String(c).trim()==='')) continue;
      const no = String(row[0]??'').trim();
      if(!no) continue;
      const dogru = parseInt(row[1]); const yanlis = parseInt(row[2]); const bos = parseInt(row[3]);
      const student = byNo[no];
      if(!student){ unmatched++; continue; }
      matched++;
      upserts.push({student_id: student.id, slot_no: slotNo, dogru: isNaN(dogru)?null:dogru, yanlis: isNaN(yanlis)?null:yanlis, bos: isNaN(bos)?null:bos});
    }
    if(!upserts.length){ showToast('Eşleşen öğrenci bulunamadı (öğrenci numaralarını kontrol et)'); return; }
    const { error } = await sb.from('quiz_scores').upsert(upserts);
    if(error){ showToast('Hata: '+error.message); return; }
    upserts.forEach(u=>{
      state.cls.quizScores[u.student_id] = state.cls.quizScores[u.student_id] || {};
      state.cls.quizScores[u.student_id][slotNo] = { dogru:u.dogru, yanlis:u.yanlis, bos:u.bos };
    });
    render();
    const q = state.cls.quizzes.find(x=>x.slot_no===slotNo);
    logActivity('"'+(q?q.label:'')+'" için Excelden '+matched+' öğrenci sonucu yükledi'+(unmatched?(' ('+unmatched+' satır eşleşmedi)'):''));
    showToast(matched+' öğrenci güncellendi'+(unmatched?(', '+unmatched+' satır eşleşmedi'):''));
  }catch(err){ showToast('Dosya okunamadı: '+err.message); }
}

async function renamePerfTask(oldLabel, newLabel){
  newLabel = newLabel.trim();
  if(!newLabel || newLabel===oldLabel) return;
  const t = state.cls.perfTasks.find(x=>x.label===oldLabel);
  if(t) t.label = newLabel;
  if(state.cls.rubrics[oldLabel]){ state.cls.rubrics[newLabel]=state.cls.rubrics[oldLabel]; delete state.cls.rubrics[oldLabel]; }
  for(const sid in state.cls.rubricScores){
    if(state.cls.rubricScores[sid][oldLabel]){ state.cls.rubricScores[sid][newLabel]=state.cls.rubricScores[sid][oldLabel]; delete state.cls.rubricScores[sid][oldLabel]; }
  }
  if(state.rubricLevel===oldLabel) state.rubricLevel = newLabel;
  render();
  await sb.from('performance_tasks').update({label:newLabel}).eq('class_id', state.cls.id).eq('label', oldLabel);
  await sb.from('rubrics').update({level:newLabel}).eq('class_id', state.cls.id).eq('level', oldLabel);
  const ids = state.cls.students.map(s=>s.id);
  if(ids.length) await sb.from('rubric_scores').update({level:newLabel}).eq('level', oldLabel).in('student_id', ids);
  logActivity('"'+oldLabel+'" performans ödevini "'+newLabel+'" olarak yeniden adlandırdı');
  showToast('İsim güncellendi');
}
async function deletePerfTask(label){
  state.cls.perfTasks = state.cls.perfTasks.filter(t=>t.label!==label);
  delete state.cls.rubrics[label];
  for(const sid in state.cls.rubricScores){ delete state.cls.rubricScores[sid][label]; }
  if(state.rubricLevel===label) state.rubricLevel = (state.cls.perfTasks[0] && state.cls.perfTasks[0].label) || null;
  state.view='perfTasks';
  render();
  await sb.from('performance_tasks').delete().eq('class_id', state.cls.id).eq('label', label);
  await sb.from('rubrics').delete().eq('class_id', state.cls.id).eq('level', label);
  const ids = state.cls.students.map(s=>s.id);
  if(ids.length) await sb.from('rubric_scores').delete().eq('level', label).in('student_id', ids);
  logActivity('"'+label+'" performans ödevini sildi');
  showToast('Performans ödevi silindi');
}

function addCriterion(level){
  state.cls.rubrics[level] = state.cls.rubrics[level] || [];

// ============== TYT / AYT DENEMELERI (12. sinif) ==============
async function importDenemeFromExcel(file, examType){
  if(!file) return;
  const label = prompt('Yeni '+(examType==='tyt'?'TYT':'AYT')+' denemesinin adı:');
  if(!label || !label.trim()) return;
  showToast('Dosya okunuyor...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(rows.length < 2){ showToast('Dosya boş veya eksik görünüyor'); return; }
    const header = rows[0];
    const subjects = [];
    for(let c=1; c+2<header.length; c+=3){
      let name = String(header[c]||'').trim();
      name = name.replace(/\s*(D|Doğru|Y|Yanlış|B|Boş)\s*$/i,'').trim();
      if(!name) name = 'Ders '+(subjects.length+1);
      subjects.push(name);
    }
    if(!subjects.length){ showToast('Ders sütunları bulunamadı'); return; }
    const list = examType==='tyt'?state.cls.tytExams:state.cls.aytExams;
    const maxSlot = Math.max(0, ...list.map(e=>e.slot_no||0));
    const { data: examData, error: examErr } = await sb.from('deneme_exams').insert({
      class_id: state.cls.id, exam_type: examType, slot_no: maxSlot+1, label: label.trim(), subjects
    }).select();
    if(examErr){ showToast('Hata: '+examErr.message); return; }
    const exam = examData[0];
    const byNo = {};
    state.cls.students.forEach(s=>{ if(s.no) byNo[String(s.no).trim()] = s; });
    const scoreRows = [];
    let matched=0, unmatched=0;
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>String(c).trim()==='')) continue;
      const no = String(row[0]??'').trim();
      if(!no) continue;
      const student = byNo[no];
      if(!student){ unmatched++; continue; }
      matched++;
      subjects.forEach((subj, i)=>{
        const base = 1 + i*3;
        const d = parseInt(row[base]); const y = parseInt(row[base+1]); const b = parseInt(row[base+2]);
        scoreRows.push({ student_id: student.id, exam_id: exam.id, subject: subj, dogru: isNaN(d)?null:d, yanlis: isNaN(y)?null:y, bos: isNaN(b)?null:b });
      });
    }
    if(scoreRows.length){
      const { error: scoreErr } = await sb.from('deneme_scores').upsert(scoreRows, {onConflict:'student_id,exam_id,subject'});
      if(scoreErr){ showToast('Notlar kaydedilirken hata: '+scoreErr.message); }
    }
    if(examType==='tyt') state.cls.tytExams.push(exam); else state.cls.aytExams.push(exam);
    state.cls.denemeScoresByExam[exam.id] = state.cls.denemeScoresByExam[exam.id] || {};
    scoreRows.forEach(sr=>{
      state.cls.denemeScoresByExam[exam.id][sr.student_id] = state.cls.denemeScoresByExam[exam.id][sr.student_id] || {};
      state.cls.denemeScoresByExam[exam.id][sr.student_id][sr.subject] = { dogru: sr.dogru, yanlis: sr.yanlis, bos: sr.bos };
    });
    render();
    logActivity('"'+label.trim()+'" '+(examType==='tyt'?'TYT':'AYT')+' denemesini Excelden ekledi ('+matched+' öğrenci, '+subjects.length+' ders)');
    showToast(matched+' öğrenci, '+subjects.length+' ders yüklendi'+(unmatched?(', '+unmatched+' satır eşleşmedi'):''));
  }catch(err){ showToast('Dosya okunamadı: '+err.message); }
}
async function deleteDenemeExam(examId, examType){
  const list = examType==='tyt'?state.cls.tytExams:state.cls.aytExams;
  const exam = list.find(e=>e.id===examId);
  const label = exam?exam.label:'';
  if(examType==='tyt') state.cls.tytExams = state.cls.tytExams.filter(e=>e.id!==examId);
  else state.cls.aytExams = state.cls.aytExams.filter(e=>e.id!==examId);
  delete state.cls.denemeScoresByExam[examId];
  render();
  await sb.from('deneme_exams').delete().eq('id', examId);
  logActivity('"'+label+'" denemesini sildi');
  showToast('Deneme silindi');
}
async function updateDenemeScore(sid, examId, subject, field, value){
  state.cls.denemeScoresByExam[examId] = state.cls.denemeScoresByExam[examId]||{};
  state.cls.denemeScoresByExam[examId][sid] = state.cls.denemeScoresByExam[examId][sid]||{};
  state.cls.denemeScoresByExam[examId][sid][subject] = state.cls.denemeScoresByExam[examId][sid][subject]||{};
  const numVal = value===''?null:(parseInt(value)||0);
  state.cls.denemeScoresByExam[examId][sid][subject][field] = numVal;
  const rec = state.cls.denemeScoresByExam[examId][sid][subject];
  await sb.from('deneme_scores').upsert({student_id:sid, exam_id:examId, subject, dogru:rec.dogru, yanlis:rec.yanlis, bos:rec.bos}, {onConflict:'student_id,exam_id,subject'});
  showToast('Kaydedildi');
}

function renderRubric(app){
  const level = state.rubricLevel;
  const crit = state.cls.rubrics[level] || [];
  const sid = state.studentId;
  const totals = sid ? rubricTotal(sid, level) : {sum:0,max:0,grade:null};

  const topControls =
    '<button class="backlink" id="back5">'+ic('chevron')+' '+escapeHtml(state.cls.name)+' paneline dön</button>' +
    '<div class="pagehead"><h2>Performans Ödevi</h2><div class="sub">'+escapeHtml(level||'')+'</div></div>' +
    '<div class="levelpicker">' +
      state.cls.perfTasks.map(t=>'<button class="'+(t.label===level?'active':'')+'" data-lvl="'+escapeHtml(t.label)+'">'+escapeHtml(t.label)+'</button>').join('') +
      '<button class="btn btn-outline btn-sm" id="editToggle">'+(state.rubricEdit?'Bitti':'Ölçütleri Düzenle')+'</button>' +
    '</div>';

  let body = '';
  if(state.rubricEdit){
    body = crit.map((c,ci)=>{
      const levels = (c.levels||[]).map((lv,li)=>
        '<div class="levelcard" style="cursor:default;">' +
          '<div style="display:flex;gap:8px;margin-bottom:6px;">' +
            '<input type="number" value="'+lv.score+'" data-ci="'+ci+'" data-li="'+li+'" data-f="score" style="width:56px;border:1px solid var(--line);border-radius:6px;padding:6px;font-weight:700;">' +
            '<input type="text" value="'+escapeHtml(lv.label)+'" data-ci="'+ci+'" data-li="'+li+'" data-f="label" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px;">' +
            '<button class="iconbtn" data-dellvl="'+ci+':'+li+'">'+ic('trash')+'</button>' +
          '</div>' +
          '<textarea data-ci="'+ci+'" data-li="'+li+'" data-f="desc" placeholder="Açıklama" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;font-size:12.5px;min-height:40px;">'+escapeHtml(lv.desc||'')+'</textarea>' +
        '</div>'
      ).join('');
      return '<div class="critblock">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
          '<input type="text" value="'+escapeHtml(c.name)+'" data-crit="'+ci+'" data-f="name" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:8px;font-weight:700;">' +
          'Tam puan: <input type="number" value="'+c.max+'" data-crit="'+ci+'" data-f="max" style="width:50px;border:1px solid var(--line);border-radius:6px;padding:8px;">' +
          '<button class="btn btn-danger btn-sm" data-delcrit="'+ci+'">Sil</button>' +
        '</div>' + levels +
        '<button class="btn btn-outline btn-sm" data-addlvl="'+ci+'" style="width:100%;justify-content:center;margin-top:4px;">+ Seviye Ekle</button>' +
      '</div>';
    }).join('') + '<button class="btn btn-soft full" id="addCritBtn">'+ic('plus')+'Yeni Ölçüt Ekle</button>';
  } else {
    const summaryRows = state.cls.students.map(s=>{
      const t = rubricTotal(s.id, level);
      const badge = t.grade!=null?t.grade:'-';
      const low = t.grade!=null && t.grade<60;
      return '<div class="card rowcard" data-sumid="'+s.id+'" style="margin-bottom:6px;">' +
        '<div class="name">'+escapeHtml(s.name)+'</div>' +
        '<div class="pct '+(low?'low':'')+'">'+badge+'</div>' +
        '<div class="chev">'+ic('chevron')+'</div>' +
      '</div>';
    }).join('');
    const studentButtons = state.cls.students.map(s=>
      '<button class="'+(s.id===sid?'active':'')+'" data-id="'+s.id+'">'+escapeHtml(s.name)+'</button>'
    ).join('');
    const critHtml = crit.map((c,ci)=>{
      const curScore = sid ? ((state.cls.rubricScores[sid]||{})[level]||{})[ci] : null;
      const levels = (c.levels||[]).map(lv=>
        '<div class="levelcard '+(curScore===lv.score?'sel':'')+'" data-ci="'+ci+'" data-score="'+lv.score+'">' +
          '<div class="lh"><span>'+escapeHtml(lv.label)+'</span><span class="score">'+lv.score+' puan</span></div>' +
          '<div class="desc">'+escapeHtml(lv.desc)+'</div>' +
        '</div>'
      ).join('');
      return '<div class="critblock"><h3>'+escapeHtml(c.name)+' <span class="max">(tam puan: '+c.max+')</span></h3>'+levels+'</div>';
    }).join('');
    body = (crit.length===0 ? '<div class="empty">Bu performans için henüz ölçüt tanımlanmadı.<br>Yukarıdaki "Ölçütleri Düzenle" ile ekleyebilirsin.</div>' :
      '<div class="section-title"><span>Sınıf Özeti</span><span class="line"></span></div>' +
      (summaryRows || '<div class="empty">Öğrenci yok.</div>') +
      '<div class="section-title" style="margin-top:24px;"><span>'+(sid?'Puanlama':'Puanlamak için öğrenci seç')+'</span><span class="line"></span></div>' +
      '<div class="studentpicker">'+studentButtons+'</div>' +
      (sid ?
        '<div class="rubricsummary">' +
          '<div><div class="lbl">Toplam</div><div class="num">'+totals.sum+' / '+totals.max+'</div></div>' +
          '<div><div class="lbl">Not</div><div class="num">'+(totals.grade!=null?totals.grade:'-')+'</div></div>' +
        '</div>' + critHtml
        : ''));
  }

  app.innerHTML = topControls + body;

  document.getElementById('back5').onclick = backToRoster;
  document.getElementById('editToggle').onclick = ()=>{ state.rubricEdit = !state.rubricEdit; render(); };
  app.querySelectorAll('.levelpicker button[data-lvl]').forEach(b=>{
    b.onclick = ()=>{ state.rubricLevel = b.dataset.lvl; render(); };
  });

  if(state.rubricEdit){
    document.getElementById('addCritBtn').onclick = ()=> addCriterion(level);
    app.querySelectorAll('[data-delcrit]').forEach(b=> b.onclick = ()=> deleteCriterion(level, parseInt(b.dataset.delcrit)));
    app.querySelectorAll('[data-addlvl]').forEach(b=> b.onclick = ()=> addLevel(level, parseInt(b.dataset.addlvl)));
    app.querySelectorAll('[data-dellvl]').forEach(b=>{
      b.onclick = ()=>{ const [ci,li]=b.dataset.dellvl.split(':').map(Number); deleteLevel(level,ci,li); };
    });
    app.querySelectorAll('input[data-crit]').forEach(inp=>{
      inp.onblur = ()=> updateCriterion(level, parseInt(inp.dataset.crit), inp.dataset.f, inp.value);
    });
    app.querySelectorAll('[data-ci][data-li]').forEach(inp=>{
      inp.onblur = ()=> updateLevel(level, parseInt(inp.dataset.ci), parseInt(inp.dataset.li), inp.dataset.f, inp.value);
    });
  } else {
    app.querySelectorAll('[data-sumid]').forEach(el=>{
      el.onclick = ()=>{ state.studentId = el.dataset.sumid; render(); };
    });
    app.querySelectorAll('.studentpicker button').forEach(b=>{
      b.onclick = ()=>{ state.studentId = b.dataset.id; render(); };
    });
    app.querySelectorAll('.levelcard[data-ci]').forEach(el=>{
      el.onclick = ()=>{
        const ci = parseInt(el.dataset.ci), score = parseInt(el.dataset.score);
        const cur = ((state.cls.rubricScores[sid]||{})[level]||{})[ci];
        setRubricScore(sid, level, ci, cur===score?null:score);
      };
    });
  }
}

  const scores = state.cls.denemeScoresByExam[examId]||{};
  const headerCells = subjects.map(s=>'<th colspan="3" style="text-align:center;font-size:11px;padding:6px 4px;border-bottom:1px solid var(--line);">'+escapeHtml(s)+'</th>').join('');
  const subHeaderCells = subjects.map(()=> '<th style="font-size:9.5px;color:var(--ink-soft);padding:2px;">D</th><th style="font-size:9.5px;color:var(--ink-soft);padding:2px;">Y</th><th style="font-size:9.5px;color:var(--ink-soft);padding:2px;">B</th>').join('');
  const rows = sortedStudents().map(s=>{
    const rec = scores[s.id]||{};
    const cells = subjects.map(subj=>{
      const v = rec[subj]||{};
      return '<td style="padding:2px;"><input type="text" inputmode="numeric" value="'+(v.dogru!=null?v.dogru:'')+'" data-id="'+s.id+'" data-subj="'+escapeHtml(subj)+'" data-f="dogru" style="width:34px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:4px 2px;font-size:12px;"></td>' +
        '<td style="padding:2px;"><input type="text" inputmode="numeric" value="'+(v.yanlis!=null?v.yanlis:'')+'" data-id="'+s.id+'" data-subj="'+escapeHtml(subj)+'" data-f="yanlis" style="width:34px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:4px 2px;font-size:12px;"></td>' +
        '<td style="padding:2px;"><input type="text" inputmode="numeric" value="'+(v.bos!=null?v.bos:'')+'" data-id="'+s.id+'" data-subj="'+escapeHtml(subj)+'" data-f="bos" style="width:34px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:4px 2px;font-size:12px;"></td>';
    }).join('');
    return '<tr><td style="padding:6px 8px;font-size:11px;color:var(--ink-faint);">'+(s.no||'')+'</td><td style="padding:6px 8px;font-size:13px;font-weight:700;white-space:nowrap;">'+escapeHtml(s.name)+'</td>'+cells+'</tr>';
  }).join('');
  app.innerHTML =
    '<button class="backlink" id="backDS">'+ic('chevron')+' '+(examType==='tyt'?'TYT':'AYT')+' listesine dön</button>' +
    '<div class="pagehead"><h2>'+escapeHtml(exam.label)+'</h2></div>' +
    '<div class="card" style="overflow-x:auto;">' +
      '<table style="border-collapse:collapse;width:100%;"><thead><tr><th></th><th></th>'+headerCells+'</tr><tr><th></th><th></th>'+subHeaderCells+'</tr></thead><tbody>'+(rows||'')+'</tbody></table>' +
    '</div>';
  document.getElementById('backDS').onclick = ()=>{ state.view='deneme_list'; render(); };
  app.querySelectorAll('input[data-id]').forEach(inp=>{
    inp.onblur = ()=> updateDenemeScore(inp.dataset.id, examId, inp.dataset.subj, inp.dataset.f, inp.value);
  });
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await startApp(); } else { state.page='login'; render(); }
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){ document.getElementById('teacherBtn').style.display='none'; }
  });
})();
</script>
</body>
</html>
